<!doctype html>

<meta charset="utf-8">

<title>VWL Arena</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f0;--surface:#fffefa;--ink:#242f2a;--muted:#626c65;--line:#d7dcd3;--accent:#365f49;--on-accent:#fff;--soft:#e9eee5}@media(prefers-color-scheme:dark){:root{--bg:#171d19;--surface:#202922;--ink:#e7ece4;--muted:#abb7aa;--line:#425044;--accent:#b7d4b5;--on-accent:#1d3022;--soft:#2d3a2e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}.shell{max-width:680px;margin:auto;padding:28px 20px 48px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{margin:0;font-size:26px;letter-spacing:-.7px}h2{margin:0 0 12px;font-size:25px;line-height:1.25;letter-spacing:-.5px}h3{margin:0 0 8px;font-size:19px}p{margin:0 0 16px}small,.muted{color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:26px 0 28px;border-bottom:1px solid var(--line);padding-bottom:8px}button,input{font:inherit}button{min-height:48px;padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:default}button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}nav button{border:0;padding:10px 4px;background:transparent;font-size:15px}nav button[aria-current=page]{color:var(--accent);background:var(--soft);font-weight:650}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.card{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:18px}.stack{display:grid;gap:12px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{flex:1}.notice{padding:13px 16px;background:var(--soft);border-radius:10px;margin:16px 0}#storage-message{border:2px solid var(--accent)}#feedback:empty{display:none}.wide{width:100%;margin-top:18px}.small{font-size:14px}.timer{font-size:32px;font-variant-numeric:tabular-nums;line-height:1.2}.option{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option input{width:20px;height:20px;flex:none;accent-color:var(--accent)}.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0 16px}.bar span{display:block;height:100%;background:var(--accent)}a{color:var(--accent);overflow-wrap:anywhere}.celebrate{animation:celebrate .7s ease-out}@keyframes celebrate{50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){.celebrate{animation:none}}[hidden]{display:none!important}footer{margin-top:30px;font-size:13px;color:var(--muted)}@media(max-width:360px){.shell{padding:20px 14px}.card{padding:18px}}
</style>
</head>
<body><div class="shell"><header><h1>VWL Arena</h1><small>Dein tägliches Quiz</small></header><p id="storage-message" class="notice" role="alert" hidden></p><nav aria-label="Navigation"><button type="button" data-view="home">Start</button><button type="button" data-view="stats">Statistik</button><button type="button" data-view="settings">Daten</button></nav><p id="feedback" class="notice" role="status" aria-live="polite"></p><main id="main"></main><footer>Nur auf diesem Gerät gespeichert. Kein Konto und keine Netzwerkverbindung.</footer></div>
<script>
'use strict';
const KEY='vwl-arena-v1', BACKUP_KEY='vwl-arena-backup-time', SCHEMA=1;
const thresholds=[0,200,500,900,1400,2000,2800,3800];
const rivals=[['Die Praktikantin',50],['Der Trainee',60],['Die Analystin',70],['Der Marktstratege',75],['Die Ökonometrikerin',80],['Der Chefökonom',85],['Die Notenbankerin',90],['Die Nobelpreisträgerin',95]];
const example=[{id:'beispiel-1',type:'sc',concept:'Inflation',q:'Was beschreibt Inflation?',options:['Einen anhaltenden Anstieg des allgemeinen Preisniveaus','Einen Rückgang aller Preise','Eine Zunahme der Bevölkerung'],correct:[0],why:'Inflation bezeichnet einen anhaltenden Anstieg des allgemeinen Preisniveaus.'},{id:'beispiel-2',type:'mc',concept:'Geldpolitik',q:'Welche Instrumente kann eine Zentralbank einsetzen?',options:['Leitzinsen verändern','Wertpapiere kaufen oder verkaufen','Einkommensteuer festlegen'],correct:[0,1],why:'Leitzinsen und Wertpapiergeschäfte gehören zu den geldpolitischen Instrumenten.'},{id:'beispiel-3',type:'sc',concept:'Angebot und Nachfrage',q:'Was kann bei unverändertem Angebot einen Preis steigen lassen?',options:['Eine höhere Nachfrage','Eine geringere Nachfrage','Ein größeres Angebot'],correct:[0],why:'Steigt die Nachfrage bei gleichem Angebot, entsteht tendenziell Aufwärtsdruck auf den Preis.'}];
const main=document.getElementById('main'), feedback=document.getElementById('feedback'); let view='home',storageProblem='',lastSummary=null;
function node(tag,value,cls){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;if(cls)e.className=cls;return e}function button(value,fn,primary=false){const b=node('button',value,primary?'primary':'');b.type='button';b.addEventListener('click',fn);return b}function title(s){const h=node('h2',s);h.tabIndex=-1;main.append(h)}function say(s){feedback.textContent=s}function go(v){view=v;say('');render();main.querySelector('h2')?.focus()}function obj(x){return x!==null&&typeof x==='object'&&!Array.isArray(x)}function text(x,max){return typeof x==='string'&&x.length>0&&x.length<=max&&!!x.trim()}function dateValid(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d,12);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d}function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function addDays(s,n){const [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d+n,12);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}function dateLabel(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12).toLocaleDateString('de-AT',{day:'numeric',month:'long',year:'numeric'})}
function validQuestion(q){if(!obj(q)||!text(q.id,120)||!['sc','mc'].includes(q.type)||!text(q.concept,120)||!text(q.q,2000)||!text(q.why,3000)||!Array.isArray(q.options)||q.options.length<2||q.options.length>6||q.options.some(x=>!text(x,1000))||!Array.isArray(q.correct)||q.correct.length<1||q.correct.length>q.options.length||q.correct.some(x=>!Number.isInteger(x)||x<0||x>=q.options.length)||new Set(q.correct).size!==q.correct.length||(q.type==='sc'&&q.correct.length!==1)||(q.type==='mc'&&q.correct.length<2))throw Error('Frage ungültig.');let source;if(q.source!==undefined){if(!text(q.source,2048))throw Error('Quelle ungültig.');try{const u=new URL(q.source);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error();source=u.href}catch{throw Error('Quelle ungültig.')}}return {id:q.id,type:q.type,concept:q.concept,...(source?{source}:{}),q:q.q,options:[...q.options],correct:[...q.correct],why:q.why}}
function validPack(p){if(!obj(p)||p.v!==1||!text(p.id,120)||!dateValid(p.date)||!Array.isArray(p.questions)||p.questions.length<3||p.questions.length>10)throw Error('Paket ungültig.');const questions=p.questions.map(validQuestion);if(new Set(questions.map(q=>q.id)).size!==questions.length)throw Error('Doppelte Fragen.');return {v:1,id:p.id,date:p.date,questions}}
function fresh(){return {schemaVersion:SCHEMA,packs:[],attempts:[],rounds:[],active:null}}
function validateData(x){if(!obj(x)||x.schemaVersion!==SCHEMA||!Array.isArray(x.packs)||x.packs.length>10000||!Array.isArray(x.attempts)||x.attempts.length>100000||!Array.isArray(x.rounds)||x.rounds.length>100000)throw Error('Schema ungültig.');const packs=x.packs.map(validPack), ids=new Set(),qids=new Set();for(const p of packs){if(ids.has(p.id))throw Error('Doppelte Pakete.');ids.add(p.id);for(const q of p.questions){if(qids.has(q.id))throw Error('Doppelte Fragen.');qids.add(q.id)}}const attempts=x.attempts.map(a=>{if(!obj(a)||!qids.has(a.qid)||!dateValid(a.date)||!Number.isSafeInteger(a.at)||a.at<1||![0,5,10].includes(a.base)||![0,2].includes(a.bonus)||!Number.isInteger(a.points)||![0,a.base+a.bonus].includes(a.points)||!Array.isArray(a.selected)||new Set(a.selected).size!==a.selected.length)throw Error('Versuch ungültig.');const q=packs.flatMap(p=>p.questions).find(q=>q.id===a.qid);if(a.selected.some(i=>!Number.isInteger(i)||i<0||i>=q.options.length))throw Error('Auswahl ungültig.');return {qid:a.qid,date:a.date,at:a.at,base:a.base,bonus:a.bonus,points:a.points,selected:[...a.selected]}});const rounds=x.rounds.map(r=>{if(!obj(r)||!text(r.id,120)||!dateValid(r.date)||!Number.isInteger(r.level)||r.level<0||r.level>7||!Number.isInteger(r.score)||r.score<0||!Number.isInteger(r.max)||r.max<10||r.max>130||r.max%10||typeof r.win!=='boolean'||r.win!==(r.score>=Math.round(r.max*rivals[r.level][1]/100)))throw Error('Runde ungültig.');return {id:r.id,date:r.date,level:r.level,score:r.score,max:r.max,win:r.win}});if(new Set(rounds.map(r=>r.id)).size!==rounds.length)throw Error('Doppelte Runden.');let active=null;if(x.active!==null){const a=x.active;if(!obj(a)||!text(a.id,120)||typeof a.example!=='boolean'||!Array.isArray(a.questions)||a.questions.length<1||a.questions.length>13||!Number.isInteger(a.index)||a.index<0||a.index>=a.questions.length||!Number.isInteger(a.level)||a.level<0||a.level>7||!Number.isSafeInteger(a.start)||!Number.isSafeInteger(a.end)||a.end<=a.start||!Array.isArray(a.order)||!Array.isArray(a.selected)||typeof a.submitted!=='boolean'||!Number.isInteger(a.score)||a.score<0||!Array.isArray(a.results)||a.results.length!==a.index+(a.submitted?1:0))throw Error('Aktive Runde ungültig.');const qs=a.questions.map(validQuestion);if(new Set(qs.map(q=>q.id)).size!==qs.length||(!a.example&&qs.some(q=>!qids.has(q.id)||JSON.stringify(q)!==JSON.stringify(packs.flatMap(p=>p.questions).find(z=>z.id===q.id)))))throw Error('Rundenfragen ungültig.');const n=qs[a.index].options.length;if(a.order.length!==n||new Set(a.order).size!==n||a.order.some(i=>!Number.isInteger(i)||i<0||i>=n)||new Set(a.selected).size!==a.selected.length||a.selected.some(i=>!Number.isInteger(i)||i<0||i>=n)||(qs[a.index].type==='sc'&&a.selected.length>1))throw Error('Auswahl ungültig.');const results=a.results.map(r=>{if(!obj(r)||![0,5,10].includes(r.base)||![0,2].includes(r.bonus)||!Number.isInteger(r.points)||![0,r.base+r.bonus].includes(r.points))throw Error('Ergebnis ungültig.');return {base:r.base,bonus:r.bonus,points:r.points}});active={id:a.id,example:a.example,questions:qs,index:a.index,level:a.level,start:a.start,end:a.end,order:[...a.order],selected:[...a.selected],submitted:a.submitted,score:a.score,results}}
return {schemaVersion:SCHEMA,packs,attempts,rounds,active}}
function warning(s){storageProblem=s;const e=document.getElementById('storage-message');e.textContent=s;e.hidden=false}function read(){let raw;try{raw=localStorage.getItem(KEY)}catch{warning('Speicher nicht verfügbar. Änderungen bleiben nur bis zum Schließen dieser Seite erhalten. Bitte Daten exportieren.');return fresh()}if(raw!==null)try{return validateData(JSON.parse(raw))}catch{warning('Gespeicherte Daten sind ungültig und wurden nicht überschrieben. Diese Seite nutzt vorläufige Daten. Bitte gültige Daten importieren.')}return fresh()}let data=read();function save(){if(storageProblem.startsWith('Gespeicherte Daten'))return false;try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{warning('Speicher nicht verfügbar. Änderungen bleiben nur bis zum Schließen dieser Seite erhalten. Bitte Daten exportieren.');return false}}
function importFragment(){if(!location.hash)return;const hash=location.hash;history.replaceState(null,'',location.pathname+location.search);try{if(!/^#pack=[A-Za-z0-9_-]+$/.test(hash)||hash.length>150000)throw Error();const raw=hash.slice(6).replace(/-/g,'+').replace(/_/g,'/');if(raw.length%4===1)throw Error();const bytes=Uint8Array.from(atob(raw+'='.repeat((4-raw.length%4)%4)),c=>c.charCodeAt(0));const p=validPack(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)));if(data.packs.some(x=>x.id===p.id)){say('Dieses Paket wurde bereits importiert.');return}const existing=new Set(data.packs.flatMap(x=>x.questions.map(q=>q.id)));if(p.questions.some(q=>existing.has(q.id)))throw Error();data.packs.push(p);save();say('Paket vom '+dateLabel(p.date)+' importiert.')}catch{say('Das Paket konnte nicht gelesen werden. Bitte einen gültigen Quiz-Link verwenden.')}}
function total(){return data.attempts.reduce((n,a)=>n+a.points,0)}function level(){let l=0;while(l<7&&total()>=thresholds[l+1]&&data.rounds.some(r=>r.level===l&&r.win))l++;return l}function streakInfo(){const days=[...new Set(data.rounds.map(r=>r.date))].sort();let current=0,record=0,prev=null;for(const d of days){current=prev&&d<=addDays(prev,2)?current+1:1;record=Math.max(record,current);prev=d}if(prev&&today()>addDays(prev,2))current=0;return {current,record,last:prev,missed:!!prev&&today()===addDays(prev,2)}}function reviewInfo(q){const attempts=data.attempts.filter(a=>a.qid===q.id).sort((a,b)=>a.at-b.at);if(!attempts.length)return null;let stage=0,due='';for(const a of attempts){if(a.base===10){stage=Math.min(stage+1,4);due=addDays(a.date,[1,3,7,21][stage-1])}else{stage=0;due=addDays(a.date,1)}}return {due,stage}}
function shuffle(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(exampleMode=false){if(data.active){go('quiz');return}const all=data.packs.flatMap(p=>p.questions),newQs=all.filter(q=>!data.attempts.some(a=>a.qid===q.id));const pack=data.packs.find(p=>p.questions.some(q=>newQs.includes(q)));const freshQs=pack?pack.questions.filter(q=>newQs.includes(q)):[];const due=all.map(q=>({q,info:reviewInfo(q)})).filter(x=>x.info&&x.info.due<=today()&&!freshQs.includes(x.q)).sort((a,b)=>a.info.due.localeCompare(b.info.due)).slice(0,3).map(x=>x.q);const qs=exampleMode?example:[...freshQs,...due];if(!qs.length){say('Heute sind keine Fragen fällig. Ein neues Paket kommt über einen Quiz-Link.');return}const now=Date.now();data.active={id:now.toString(36)+Math.random().toString(36).slice(2),example:exampleMode,questions:qs,index:0,level:level(),start:now,end:now+(qs[0].type==='sc'?45000:60000),order:shuffle(qs[0].options.length),selected:[],submitted:false,score:0,results:[]};save();go('quiz')}
function submit(){const a=data.active;if(!a||a.submitted)return;const q=a.questions[a.index],right=a.selected.filter(i=>q.correct.includes(i)).length,wrong=a.selected.length-right;let base=right===q.correct.length&&wrong===0?10:(q.type==='mc'&&right>=q.correct.length/2&&wrong<=1?5:0);const bonus=base===10&&Date.now()-a.start<=(a.end-a.start)/2?2:0;const day=today(),repeated=!a.example&&data.attempts.some(x=>x.qid===q.id&&x.date===day);const points=a.example||repeated?0:base+bonus;a.submitted=true;a.score+=points;a.results.push({base,bonus,points});if(!a.example)data.attempts.push({qid:q.id,date:day,at:Date.now(),base,bonus,points,selected:[...a.selected]});save();render()}
function next(){const a=data.active;if(!a||!a.submitted)return;if(a.index+1<a.questions.length){a.index++;a.start=Date.now();a.end=a.start+(a.questions[a.index].type==='sc'?45000:60000);a.order=shuffle(a.questions[a.index].options.length);a.selected=[];a.submitted=false;save();render();return}const before=streakInfo(),oldLevel=level(),max=a.questions.length*10,target=Math.round(max*rivals[a.level][1]/100),win=a.score>=target;if(!a.example)data.rounds.push({id:a.id,date:today(),level:a.level,score:a.score,max,win});const after=streakInfo();lastSummary={example:a.example,score:a.score,max,target,win,level:a.level,celebrate:!a.example&&(win||level()>oldLevel||after.record>before.record)};data.active=null;save();go('summary')}
function backupStatus(){try{const s=localStorage.getItem(BACKUP_KEY);return s?'Letzte Sicherung: '+new Date(Number(s)).toLocaleString('de-AT'):'Noch keine Sicherung'}catch{return 'Noch keine Sicherung'}}function download(name='vwl-arena-'+today()+'.json'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function backupData(){const name='vwl-arena-backup-'+today()+'.json',file=new File([JSON.stringify(data,null,2)],name,{type:'application/json'});const mark=()=>{try{localStorage.setItem(BACKUP_KEY,String(Date.now()))}catch{}document.querySelectorAll('.backup-status').forEach(x=>x.textContent=backupStatus())};if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:name});mark();return}catch(error){if(error.name==='AbortError')return}}download(name);mark()}function backup(parent){parent.append(button('In Drive sichern',backupData),node('p',backupStatus(),'small muted backup-status'))}
function progress(parent,l){const points=total(),next=thresholds[l+1];parent.append(node('p',next?'Level '+(l+1)+' · '+points+' / '+next+' Punkte':'Level 8 · '+points+' Punkte'));const bar=node('div',undefined,'bar'),fill=node('span');fill.style.width=(next?Math.max(0,Math.min(100,(points-thresholds[l])/(next-thresholds[l])*100)):100)+'%';bar.append(fill);parent.append(bar);if(next)parent.append(node('p','Für Level '+(l+2)+': '+next+' Punkte und mindestens ein Sieg gegen '+rivals[l][0]+'.','small muted'))}
function showHome(){title('Deine Arena');const l=level(),s=streakInfo(),card=node('section',undefined,'card');card.append(node('p','DEIN FORTSCHRITT','eyebrow'));progress(card,l);card.append(node('p','Serie: '+s.current+' '+(s.current===1?'Tag':'Tage')+' · Rekord: '+s.record));if(s.missed)card.append(node('p','Nie zweimal auslassen','notice'));card.append(node('p',data.rounds.some(r=>r.date===today())?'Heute: Runde abgeschlossen':'Heute: noch keine Runde abgeschlossen','muted'));main.append(card);const rival=node('section',undefined,'card');rival.append(node('p','DEIN AKTUELLES DUELL','eyebrow'),node('h3',rivals[l][0]),node('p','Level '+(l+1)+' · Ziel: '+rivals[l][1]+' % der möglichen Basispunkte.'));main.append(rival);if(data.active){main.append(button('Runde fortsetzen',()=>go('quiz'),true));return}const hasPacks=data.packs.length>0;const b=button(hasPacks?'Runde starten':'Beispielrunde starten',()=>start(!hasPacks),true);b.className+=' wide';main.append(b);if(!hasPacks)main.append(node('p','Beispielrunde mit drei allgemeinen VWL-Fragen. Sie zählt nicht für Punkte oder Serie.','small muted'));else main.append(node('p','Neue Fragen zuerst, danach bis zu drei fällige Wiederholungen.','small muted'))}
function showQuiz(){const a=data.active;if(!a){go('home');return}const q=a.questions[a.index];title(a.example?'Beispielrunde':'Deine Runde');main.append(node('p','Frage '+(a.index+1)+' von '+a.questions.length+' · '+(q.type==='mc'?'Mehrere richtig':'Eine Antwort richtig'),'eyebrow'));const card=node('section',undefined,'card');card.append(node('p',q.concept,'muted'),node('h3',q.q));if(!a.submitted){const timer=node('p','','timer');timer.id='timer';timer.setAttribute('aria-label','Verbleibende Zeit');card.append(timer);const opts=node('div',undefined,'stack');a.order.forEach(i=>{const label=node('label',undefined,'option'),input=node('input');input.type=q.type==='sc'?'radio':'checkbox';input.name='antwort';input.checked=a.selected.includes(i);input.addEventListener('change',()=>{if(a.submitted)return;if(q.type==='sc')a.selected=[i];else a.selected=input.checked?[...a.selected,i]:a.selected.filter(x=>x!==i);save()});label.append(input,node('span',q.options[i]));opts.append(label)});card.append(opts);const b=button('Antwort prüfen',submit,true);b.className+=' wide';card.append(b)}else{const r=a.results[a.index];card.append(node('p',r.base===10?'Richtig':r.base===5?'Teilweise richtig':'Noch nicht richtig','notice'));card.append(node('p','Richtig: '+q.correct.map(i=>q.options[i]).join(' · ')),node('p',q.why));if(q.source){const p=node('p'),link=node('a','Quelle öffnen');link.href=q.source;link.target='_blank';link.rel='noopener noreferrer';p.append(link);card.append(p)}card.append(node('p',a.example?'Beispielrunde · keine Punkte':r.points+' Punkte'+(r.points&&r.bonus?' · inklusive 2 Tempopunkte':r.points===0&&r.base>0?' · heute bereits beantwortet':''),'muted'));card.append(button(a.index+1===a.questions.length?'Zur Auswertung':'Weiter',next,true))}main.append(card);tick()}
function showSummary(){const s=lastSummary;if(!s){go('home');return}title('Runde abgeschlossen');const card=node('section',undefined,'card'+(s.celebrate?' celebrate':''));if(s.example){card.append(node('h3','Beispielrunde geschafft'),node('p','Diese Runde zählt nicht für Punkte oder Serie.'))}else{card.append(node('h3',s.score+' Punkte'),node('p',s.win?'Duell gewonnen!':'Duell abgeschlossen.'),node('p',rivals[s.level][0]+': '+s.target+' Punkte · dein Ergebnis: '+s.score+' Punkte'));progress(card,level());const streak=streakInfo();card.append(node('p','Serie: '+streak.current+' '+(streak.current===1?'Tag':'Tage')+' · Rekord: '+streak.record))}main.append(card);backup(main);main.append(button('Zur Startseite',()=>go('home')))}
function showStats(){title('Statistik');const cutoff=addDays(today(),-29),qs=data.packs.flatMap(p=>p.questions),by=new Map();for(const a of data.attempts.filter(a=>a.date>=cutoff&&a.date<=today())){const q=qs.find(q=>q.id===a.qid);if(!q)continue;const v=by.get(q.concept)||{n:0,full:0};v.n++;if(a.base===10)v.full++;by.set(q.concept,v)}main.append(node('p','Insgesamt '+data.attempts.length+' beantwortete Fragen.','muted'));const card=node('section',undefined,'card');card.append(node('h3','Trefferquote nach Konzept'),node('p','Letzte 30 Tage · vollständig richtige Antworten','small muted'));const entries=[...by.entries()].sort((a,b)=>a[0].localeCompare(b[0],'de'));if(!entries.length)card.append(node('p','Noch keine Ergebnisse in diesem Zeitraum.'));for(const [name,v] of entries){const percent=Math.round(v.full/v.n*100);card.append(node('p',name+' · '+percent+' % ('+v.full+'/'+v.n+')'));const bar=node('div',undefined,'bar'),fill=node('span');fill.style.width=percent+'%';bar.append(fill);card.append(bar)}main.append(card);const weak=node('section',undefined,'card');weak.append(node('h3','Konzepte zum Vertiefen'));const list=entries.filter(([,v])=>v.full<v.n).sort((a,b)=>a[1].full/a[1].n-b[1].full/b[1].n);weak.append(node('p',list.length?list.map(([name,v])=>name+' ('+Math.round(v.full/v.n*100)+' %)').join(' · '):'Noch keine schwachen Konzepte erkennbar.'));main.append(weak)}
function showSettings(){title('Daten');const card=node('section',undefined,'card');card.append(node('h3','Sicherung'),node('p','Alle Daten als JSON sichern oder eine Sicherung importieren. Der Import ersetzt die vorhandenen Daten.','muted'),button('JSON exportieren',()=>download()));backup(card);const label=node('label','JSON importieren'),file=node('input');file.type='file';file.accept='.json,application/json';file.id='import-file';label.htmlFor=file.id;card.append(label,node('br'),file);const preview=node('div');card.append(preview);file.addEventListener('change',async()=>{preview.replaceChildren();const f=file.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('Datei ist größer als 5 MB.');const candidate=validateData(JSON.parse(await f.text()));preview.append(node('p','Gültige Datei: '+candidate.packs.length+' Pakete und '+candidate.rounds.length+' Runden. Der Import ersetzt alle vorhandenen Daten.','notice'));preview.append(button('Daten ersetzen',()=>{if(!window.confirm('Alle VWL-Arena-Daten durch diese Datei ersetzen?'))return;const old=data,prior=storageProblem;data=validateData(candidate);storageProblem='';if(!save()){data=old;storageProblem=prior;say('Import nicht gespeichert. Vorhandene Daten bleiben erhalten.');return}document.getElementById('storage-message').hidden=true;lastSummary=null;go(data.active?'quiz':'home');say('Daten importiert.')},true))}catch{preview.append(node('p','Die Datei konnte nicht importiert werden. Bitte eine gültige Sicherung wählen.','notice'))}});main.append(card)}
function render(){main.replaceChildren();document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});({home:showHome,quiz:showQuiz,summary:showSummary,stats:showStats,settings:showSettings}[view])()}
function tick(){const a=data.active;if(!a||a.submitted)return;const left=Math.max(0,Math.ceil((a.end-Date.now())/1000)),timer=document.getElementById('timer');if(timer)timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left)submit()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('focus',tick);importFragment();if(data.active)view='quiz';render();tick();setInterval(tick,1000);
</script></body></html>
