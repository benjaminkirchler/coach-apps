    const BACKUP_KEY = 'start-first-backup-time';
    function backupStatus() {
      try { const saved=localStorage.getItem(BACKUP_KEY); return saved ? 'Zuletzt geteilt oder heruntergeladen: '+new Date(Number(saved)).toLocaleString('de-AT') : 'Noch keine Sicherung geteilt oder heruntergeladen'; }
      catch { return 'Noch keine Sicherung geteilt oder heruntergeladen'; }
    }
    async function backupData() {
      const name='start-first-backup-'+dayKey()+'.json';
      const file=new File([JSON.stringify(data,null,2)],name,{type:'application/json'});
      const mark=()=>{ try { localStorage.setItem(BACKUP_KEY,String(Date.now())); } catch {} document.querySelectorAll('.backup-status').forEach(x=>{ x.textContent=backupStatus(); }); };
      if (navigator.canShare && navigator.canShare({files:[file]}) && navigator.share) {
        try { await navigator.share({files:[file],title:name}); mark(); return; }
        catch (error) { if (error.name==='AbortError') return; }
      }
      downloadData(name); mark();
    }

      const backup=settingGroup('Deine Daten',backupStatus()),input=node('input');input.id='import';input.type='file';input.accept='.json,application/json';input.hidden=true;input.className='hidden-file';input.setAttribute('aria-label','JSON importieren');backup.list.append(dataAction('Sicherung teilen / herunterladen',backupData,'share','grey'),dataAction('JSON exportieren',()=>downloadData(),'export','blue'),dataAction('JSON importieren …',()=>input.click(),'tray','orange'));backup.section.append(input);const status=backup.section.querySelector('.group-footer');status.className+=' backup-status';main.append(backup.section);

    function remaining(d) {
      const seconds = Math.max(0,Math.ceil((d.endTime-Date.now())/1000));
      return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    }

    function tick() {

      const changed = reconcile();
      if (view==='today' && !areaOpen && homeSignature()!==lastHomeSignature && !changed && observedDay===dayKey()) { render(); return; }
      if (observedDay !== dayKey() || changed) {
        const newDay = observedDay !== dayKey(); render();
        if (newDay) say('Ein neuer Tag hat begonnen. Heute ist '+dateLabel(dayKey())+'.');

    save(); render(); setInterval(tick,1000);
