    const KEY = 'start-first-v1';

    // Construct calendar dates in local time, including across daylight-saving changes.

    // Build a new object rather than trusting properties from an imported file.
    function validateData(input) {

      if (!Array.isArray(s.areas) || s.areas.length < 1 || s.areas.length > 20 || s.areas.some(a => !shortText(a,60) || !a.trim() || a !== a.trim()) || new Set(s.areas).size !== s.areas.length) throw Error('Gib 1–20 unterschiedliche Lebensbereiche mit jeweils bis zu 60 Zeichen ein.');

const THEME_KEY='start-theme', THEMES=['dark','light','system'];
