<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Gym Log</title>
  <style>
    /* Shared palette with benjaminkirchler.github.io. */
    :root { color-scheme:light; --bg:#f8f7f4; --surface:#ffffff; --ink:#1a1917; --muted:#716d66; --line:#e0ded9; --accent:#1040a0; --on-accent:#fff; --soft:#efede8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 system-ui,sans-serif; }
    .shell { max-width:680px; margin:auto; padding:12px 16px calc(20px + env(safe-area-inset-bottom)); min-width:0; }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:16px; color:var(--muted); font-weight:600; }
    header { margin-bottom:16px; }
    main { min-width:0; }
    h2 { margin:0 0 12px; font-size:25px; line-height:1.25; letter-spacing:-.5px; }
    h3 { margin:0 0 8px; font-size:19px; }
    p { margin:0 0 16px; }
    small,.muted { color:var(--muted); }
    .eyebrow { font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    nav { display:grid; grid-template-columns:1fr 48px; gap:4px; margin:28px 0 0; border-top:1px solid var(--line); padding-top:8px; }
    button,input,select,textarea { font:inherit; }
    input,select,textarea { font-size:17px; }
    button { min-height:48px; padding:11px 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); cursor:pointer; text-align:center; }
    button:hover { border-color:var(--accent); }
    button:disabled { opacity:.55; cursor:default; }
    button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    nav button { border:0; padding:10px 4px; background:transparent; font-size:15px; }
    nav svg { width:23px; height:23px; display:block; margin:auto; }
    .back-home { border:0; padding-left:0; background:transparent; color:var(--accent); margin-bottom:12px; }
    nav button[aria-current="page"] { color:var(--accent); background:var(--soft); font-weight:650; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .card { padding:22px; border:1px solid var(--line); border-radius:16px; background:var(--surface); margin-bottom:18px; }
    .stack { display:grid; gap:12px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .row>* { flex:1; }
    label { display:block; margin:16px 0 7px; font-size:15px; font-weight:600; }
    input:not([type=file]),select,textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); min-height:48px; }
    input[type=file] { max-width:100%; }
    textarea { resize:vertical; min-height:88px; }
    .timer { font-size:64px; font-variant-numeric:tabular-nums; letter-spacing:-3px; margin:12px 0; line-height:1.2; }
    .notice { padding:13px 16px; background:var(--soft); border-radius:10px; margin:16px 0; }
    #storage-message { border:2px solid var(--accent); }
    #feedback:empty { display:none; }
    .item { padding:16px 0; border-bottom:1px solid var(--line); }
    .item:last-child { border-bottom:0; }
    .wide { width:100%; margin-top:18px; }
    .small { font-size:14px; }
    .uncertain { border-left:4px solid #a16a23; padding-left:10px; }
    [hidden] { display:none !important; }
    .workout-bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,680px); background:var(--surface); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:3; }
    .workout-bottom p { margin:0; font-size:14px; }
    .workout-bottom progress { width:100%; height:10px; accent-color:var(--accent); }
    .workout-bottom .rest-bar { position:static; transform:none; width:100%; padding:8px 0; box-shadow:none; margin-top:6px; }
    .goal { grid-column:2 / -1; font-size:12px; color:var(--muted); }
    .next-actions { display:grid; gap:10px; margin:16px 0; }
    .workout-header { position:sticky; top:0; z-index:3; background:var(--bg); padding:12px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); margin-bottom:18px; }
    .workout-header h2 { font-size:21px; margin:0; }
    .workout-header p { margin:0; }
    .rest-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,680px); z-index:4; background:var(--surface); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; align-items:center; gap:8px; box-shadow:0 -4px 20px #0001; }
    .rest-bar .rest-description { flex:1; min-width:120px; }
    .rest-bar p { margin:0; }
    .rest-bar button { padding:8px 12px; }
    .rest-bar .timer { font-size:26px; letter-spacing:0; }
    body.training .shell { padding-bottom:110px; }
    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    button,input,select,textarea { font:inherit; }
    button { touch-action:manipulation; overflow-wrap:anywhere; }
    .shell { padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right)); }
    body.training nav,body.training > .shell > header,body.training footer { display:none; }
    body.training .workout-header { position:static; }
    .set-grid { display:grid; grid-template-columns:28px minmax(64px,1fr) minmax(64px,1fr) 52px; gap:5px; align-items:center; margin:8px 0; font-size:14px; }
    .set-grid input { min-width:0; padding:10px 5px; text-align:center; }
    .set-grid button { padding:8px; }
    input[aria-invalid="true"] { border:2px solid #b74730; }
    .set-adjuster { grid-column:1 / -1; padding:10px; background:var(--soft); border-radius:10px; }
    .set-adjuster p { margin:0 0 8px; font-size:14px; }
    .set-adjuster .row { flex-wrap:nowrap; gap:6px; }
    .set-adjuster button { min-width:48px; }
    .set-grid.is-done { background:var(--soft); border-radius:10px; }
    .set-grid > :nth-child(2) { display:none; }
    .set-grid input { font-size:18px; min-height:52px; }
    .set-grid button { min-height:52px; }
    .set-grid .previous { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
    .exercise-card { padding:16px; scroll-margin-top:100px; }
    .exercise-card h3 { margin-bottom:4px; }
    details { margin-top:12px; }
    summary { cursor:pointer; min-height:44px; padding:10px 0; }
    .training-hero { padding:24px; margin:24px 0 8px; }
    .training-hero h3 { font-size:32px; letter-spacing:-1px; margin-bottom:28px; }
    .training-hero button { width:100%; min-height:56px; }
    .training-hero + button { width:100%; border:0; background:transparent; color:var(--muted); margin-bottom:24px; }
    .current-set { min-height:244px; }
    .set-grid { grid-template-columns:1fr 1fr; gap:8px 16px; padding:12px 0; }
    .set-grid > :first-child,.set-grid > .previous,.set-grid > .goal { display:none; }
    .set-grid .weight-label { display:block; grid-column:1; grid-row:1; }
    .set-grid .reps-label { display:block; grid-column:2; grid-row:1; }
    .set-grid label { margin:0; font-size:14px; color:var(--muted); font-weight:500; }
    .set-grid input { grid-row:2; width:100%; min-width:0; font-size:24px; min-height:56px; font-weight:600; }
    .set-grid > button { grid-column:1 / -1; grid-row:3; width:100%; margin-top:12px; min-height:56px; font-size:17px; }
    .set-grid .bodyweight-value { grid-column:1; grid-row:2; font-size:16px; align-self:center; }
    .set-history .bodyweight-value { grid-row:3; }
    .active-set input { font-size:32px; min-height:76px; background:transparent; border-color:transparent; }
    .active-set input:focus { background:var(--bg); border-color:var(--line); }
    .set-history .set-grid { padding:16px 10px; border-bottom:1px solid var(--line); }
    .set-history .set-grid > :first-child { display:block; grid-column:1 / -1; font-size:14px; }
    .set-history .set-grid .weight-label,.set-history .set-grid .reps-label { grid-row:2; }
    .set-history .set-grid input { grid-row:3; }
    .set-history .set-grid > button { grid-row:4; }
    .exercise-card h3 { font-size:30px; letter-spacing:-.7px; }
    .exercise-card { padding:20px; }
    body.training .workout-header { padding:0 0 12px; }
    body.training .shell { padding-top:16px; }
    #feedback { position:fixed; left:16px; right:16px; bottom:90px; z-index:5; margin:0 auto; max-width:648px; pointer-events:none; }
    .exercise-jump { display:flex; gap:8px; overflow:auto; padding-bottom:12px; margin-bottom:12px; }
    .exercise-jump button { white-space:nowrap; font-size:14px; }
    footer { margin-top:16px; font-size:13px; color:var(--muted); }
    @media (max-width:360px) { .shell { padding:20px 14px; } .card { padding:18px; } }

    .value-wheel { display:none; }
    .active-set .value-wheel { display:block; grid-row:2; height:132px; overflow-y:auto; overscroll-behavior-y:contain; scroll-snap-type:y mandatory; padding:44px 0; border-radius:12px; background:linear-gradient(to bottom,var(--bg) 0 33.33%,var(--soft) 33.33% 66.66%,var(--bg) 66.66%); scrollbar-width:none; touch-action:pan-y; }
    .value-wheel::-webkit-scrollbar { display:none; }
    .value-wheel.weight-wheel { grid-column:1; }
    .value-wheel.reps-wheel { grid-column:2; }
    .wheel-option { height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0; scroll-snap-align:center; font-size:24px; font-variant-numeric:tabular-nums; color:var(--muted); cursor:pointer; }
    .wheel-option[aria-selected="true"] { color:var(--ink); font-size:32px; font-weight:650; }
    .active-set input { display:none; }
    .active-set.manual-values input { display:block; }
    .active-set.manual-values .value-wheel { display:none; }
    .current-set { min-height:240px; }
    .exercise-card { padding:16px; margin-bottom:8px; }
    .exercise-card h3 { font-size:28px; }
    .exercise-card > p { margin-bottom:8px; }
    .exercise-card details { margin-top:0; }
    .set-grid { padding:4px 0; margin:0; gap:6px 12px; }
    .set-grid label { text-align:center; }
    .set-grid > button { margin-top:8px; }
    .workout-actions { grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
    .workout-actions > button { padding:10px 8px; font-size:14px; }
    #next-exercise { grid-column:1 / -1; font-size:17px; }
    body.training .eyebrow { margin-bottom:6px; }
    body.training .workout-header { margin-bottom:10px; padding-bottom:8px; }
    .workout-header > div { flex:1; min-width:0; }
    body.training .shell { padding-top:8px; padding-bottom:90px; }
    .workout-manage { margin-top:4px; }
    #feedback { bottom:76px; font-size:14px; padding:8px 12px; }

    /* The action dock occupies normal layout space, including timer and safe area. */
    body.training .shell { padding-bottom:0; }
    body.training main { display:flex; flex-direction:column; min-height:calc(100svh - 36px); }
    .workout-bottom { position:sticky; bottom:0; left:auto; transform:none; width:100%; margin-top:auto; padding:10px 0 max(10px,env(safe-area-inset-bottom)); }
    #complete-set { width:100%; min-height:56px; margin-top:8px; }
    .active-set > button { display:none; }
    .current-set { min-height:228px; }
    .active-set .value-wheel { height:132px; }
    .manual-values .set-adjuster { grid-row:4; }
    .workout-bottom .rest-bar { border-top:1px solid var(--line); }
    #feedback { position:static; padding:0; min-height:0; margin:0; background:transparent; }
    #feedback:not(:empty) { padding:8px 0; }
    .workout-actions { margin:8px 0 0; }
    body.training #feedback { display:block; min-height:28px; padding:2px 0; font-size:13px; }
    .preview-navigation { position:fixed; top:8px; right:8px; z-index:20; max-width:min(350px,calc(100vw - 16px)); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 12px; box-shadow:0 4px 20px #0002; }
    .preview-navigation summary { font-size:13px; min-height:36px; padding:7px 0; }
    .preview-navigation[open] { padding-bottom:10px; }
    .preview-links { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0; }
    .preview-navigation button { font-size:13px; min-height:40px; padding:6px; }
    .preview-navigation [aria-current] { background:var(--soft); color:var(--accent); }
    .preview-navigation .row { margin:6px 0; }
    .preview-navigation p { margin:6px 0 0; font-size:12px; }
    .new-workout-actions { margin:0 0 20px; }

    /* Full-screen rest: one clock, one preview, one dock action. */
    .rest-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; min-width:0; padding:24px 0 32px; text-align:center; }
    .rest-screen > h2 { margin:0; color:var(--muted); font-size:17px; font-weight:500; line-height:1.4; letter-spacing:0; }
    .rest-screen p { margin:0; }
    .rest-clock { color:var(--ink); font-size:clamp(4.25rem,27vw,7.5rem); font-weight:650; font-variant-numeric:tabular-nums; line-height:1.05; letter-spacing:-.05em; white-space:nowrap; }
    .rest-preview { display:grid; gap:4px; max-width:28ch; color:var(--muted); font-size:16px; line-height:1.45; overflow-wrap:anywhere; }
    .rest-preview strong,.rest-preview h3 { margin:0; color:var(--ink); font-size:20px; font-weight:600; line-height:1.3; letter-spacing:-.2px; }
    .rest-screen ~ .workout-bottom > button { width:100%; min-height:56px; }
    @media (max-height:640px) {
      .rest-screen { gap:14px; padding:12px 0 20px; }
      .rest-clock { font-size:clamp(3.5rem,20svh,5.75rem); }
    }
    body.resting .exercise-card,body.resting .workout-actions,body.resting .workout-manage,body.resting main > .eyebrow,body.resting #complete-set { display:none !important; }
    body.resting .workout-header { order:0; }
    body.resting .rest-screen { order:1; }
    body.resting .workout-bottom { order:2; }
    #rest-skip { width:100%; min-height:56px; margin-top:12px; }
    .rest-screen .eyebrow { text-transform:none; letter-spacing:0; font-size:17px; }
    .rest-screen summary { font-size:14px; color:var(--muted); }

    /* Quiet training navigation and exercise decisions. */
    body.training .workout-header { justify-content:flex-start; gap:0; }
    .workout-header h2 { font-size:20px; font-weight:600; line-height:1.25; letter-spacing:-.3px; }
    .workout-header #workout-elapsed { margin-top:3px; font-size:13px; line-height:1.4; }
    #workout-home-dock { display:flex; align-items:center; justify-content:center; width:44px; min-height:44px; height:44px; margin:12px auto 0; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--soft); color:var(--ink); font-size:26px; font-weight:400; line-height:1; }
    #workout-home-dock:hover { border-color:var(--muted); }
    .exercise-decision { position:fixed; inset:auto 0 0; width:min(100%,680px); max-width:100%; max-height:85svh; margin:0 auto; padding:24px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--line); border-bottom:0; border-radius:20px 20px 0 0; background:var(--surface); color:var(--ink); text-align:left; }
    .exercise-decision::backdrop { background:#1a191733; }
    .exercise-decision h2,.exercise-decision h3 { margin:0 0 8px; font-size:21px; line-height:1.3; letter-spacing:-.3px; }
    .exercise-decision p { margin:0 0 16px; color:var(--muted); font-size:15px; }
    .exercise-decision button { width:100%; min-height:48px; }
    .exercise-decision > button + button { margin-top:8px; }
    .exercise-decision button[aria-pressed="true"],.exercise-decision button.is-selected { background:var(--soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
    @media (max-height:640px) { .exercise-decision { padding-top:16px; } }
    body.training main { touch-action:pan-y pinch-zoom; }
    .workout-bottom { display:flex; flex-direction:column; }
    #workout-home-dock { order:10; align-self:center; }
  </style>
</head>
<body>
  <div class="shell">

    <p id="storage-message" class="notice" role="alert" hidden></p>

    <p id="feedback" class="notice" role="status" aria-live="polite"></p>
    <main id="main"></main>
    <nav aria-label="Navigation">
      <button type="button" data-view="history">Verlauf</button>
      <button type="button" data-view="settings" aria-label="Einstellungen" title="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9.5 3h5l.6 2.4 1.6.9 2.4-.7 2.5 4.3-1.8 1.7v1.8l1.8 1.7-2.5 4.3-2.4-.7-1.6.9-.6 2.4h-5l-.6-2.4-1.6-.9-2.4.7-2.5-4.3 1.8-1.7v-1.8L2.4 9.9l2.5-4.3 2.4.7 1.6-.9z"/>
          <circle cx="12" cy="12.5" r="3"/>
        </svg>
      </button>
    </nav>
  </div>
  <script>
    'use strict';
    const KEY = 'gym-log-v1';
    let nutritionOpen=false;
    let primaryBlockedUntil=0;
    let previewNavOpen=false;
    function blockPrimary() { primaryBlockedUntil=Date.now()+650; setTimeout(updatePrimary,660); }
    function updatePrimary() {
      const dock=document.getElementById('complete-set');
      const row=document.querySelectorAll('.active-set')[0];
      if(dock) { dock.hidden=!row || !!active()?.restEnd; dock.disabled=Date.now()<primaryBlockedUntil || (!row?.manual && !!row?.wheels?.some(w=>w.busy())); }
      const next=document.getElementById('next-exercise'); if(next) next.disabled=Date.now()<primaryBlockedUntil;
    }
    const SCHEMA = 2;
    const DEFAULTS = {
      upper:['Chest Press','Low Row','Vertical Traction','Shoulder Press','Reverse Fly','Pectoral einseitig','Back Extensions','Hammer Curls','Trizeps Pushdown'],
      lower:['Leg Press','Leg Curl','Leg Extension','Calf Raises','Adduktoren','Abduktoren','Reverse Crunches','Schrägbank-Sit-ups']
    };
    const EXTRA = ['Incline Chest Press','Lateral Raises','Hip Thrust'];
    const BODYWEIGHT = ['Reverse Crunches','Schrägbank-Sit-ups','Decline Oblique Sit-ups'];
    const main = document.getElementById('main');
    const feedback = document.getElementById('feedback');
    let view = 'home', draft = null, chosenExercise = null, selectedSession = null, historyFilter = '';
    const inputDrafts = new Map();
    let storageProblem = '', afterSet = null, lastFeedback = '', restAnnounced = false, importCandidate = null;

    function node(tag, value, className) {
      const element = document.createElement(tag);
      if (value !== undefined) element.textContent = value;
      if (className) element.className = className;
      return element;
    }
    function button(value, action, primary = false) {
      const b = node('button',value,primary ? 'primary' : ''); b.type = 'button';
      b.addEventListener('click',action); return b;
    }
    function field(parent,label,value = '',type = 'text') {
      const id = 'f'+Math.random().toString(36).slice(2);
      const caption = node('label',label); caption.htmlFor = id;
      const input = node(type === 'textarea' ? 'textarea' : 'input'); input.id = id; input.value = value;
      if (type !== 'textarea') input.type = type;
      parent.append(caption,input); return input;
    }
    function select(parent,label,options,value) {
      const caption = node('label',label), input = node('select');
      input.id = 'f'+Math.random().toString(36).slice(2); caption.htmlFor = input.id;
      options.forEach(([key,text])=>{ const o=node('option',text); o.value=key; input.append(o); });
      input.value = value; parent.append(caption,input); return input;
    }
    function say(message) { feedback.textContent = message; }
    function go(next) { if (next==='history' && view!=='home' && view!=='finish') selectedSession=null; view = next; say(''); render(); main.querySelector('h2')?.focus(); }
    function title(value) { const h=node('h2',value); h.tabIndex=-1; main.append(h); }
    function today() { const d=new Date(); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); }
    function dateLabel(key) { if (!key) return 'Datum unbekannt'; const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d,12).toLocaleDateString('de-AT',{day:'numeric',month:'long',year:'numeric'}); }
    function timeLabel(ms) { return ms === null ? 'unbekannt' : new Date(ms).toLocaleString('de-AT'); }
    function dateValid(key) { if (typeof key !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false; const [y,m,d]=key.split('-').map(Number), x=new Date(y,m-1,d,12); return x.getFullYear()===y && x.getMonth()+1===m && x.getDate()===d; }
    function kg(value) { return value === null ? '–' : String(value).replace('.',',')+' kg'; }
    function reps(value) { return value === null ? '–' : String(value); }
    function amount(value) { return value === null ? '–' : String(value).replace('.',','); }
    function parseWeight(value) { const s=value.trim().replace(',','.'); return /^\d+(?:\.\d{1,2})?$/.test(s) && Number(s)<=1000 ? Number(s) : null; }
    function parseReps(value) { const s=value.trim(); return /^\d+$/.test(s) && Number(s)>0 && Number(s)<=1000 ? Number(s) : null; }
    function parseSetText(value, bodyweight) {
      const m=value.trim().match(/^(\d+)\s*(?:x|×|mal)\s*(\d+(?:[,.]\d{1,2})?)\s*(?:kg)?$/i);
      if (!m) return null;
      const r=parseReps(m[1]), w=parseWeight(m[2]);
      return r !== null && w !== null && !bodyweight ? {reps:r,weight:w} : null;
    }

    function requestNextExercise() {

          const item=node('div',undefined,'item'); item.append(node('p',(i+1)+'. '+e));
          const row=node('div',undefined,'row');
          row.append(button('Hoch',()=>{ move(t.exercises,i,-1); save(); render(); }),button('Runter',()=>{ move(t.exercises,i,1); save(); render(); }),button('Entfernen',()=>{ t.exercises.splice(i,1); save(); render(); }));
          item.append(row); const rename=field(item,'Übung umbenennen',e); rename.maxLength=80;
          item.append(button('Umbenennen',()=>{ const n=rename.value.trim(); if (!n || (n!==e && t.exercises.includes(n))) { say('Ungültiger oder doppelter Name.'); return; } t.exercises[i]=n; save(); render(); })); box.append(item);
        });
        main.append(box);
        addExercise(main,n=>{ if (t.exercises.includes(n)) { say('Übung steht bereits in der Vorlage.'); return; } t.exercises.push(n); save(); render(); });
      }
      const backup=node('section',undefined,'card'); backup.append(node('h3','Daten'),node('p','Alle Daten als JSON sichern oder eine Sicherung einschließlich unsicherer Sätze importieren.','muted'),button('JSON exportieren',()=>download()),button('Backup teilen / herunterladen',backupData),node('p',backupStatus(),'muted backup-status'));
      const label=node('label','JSON importieren'), file=node('input'); file.type='file'; file.accept='.json,application/json'; file.id='import-file'; label.htmlFor=file.id; backup.append(label,file);
      const preview=node('div'); backup.append(preview);
      file.addEventListener('change',async()=>{
        preview.replaceChildren(); importCandidate=null; const f=file.files[0]; if (!f) return;
        try {
          if (f.size>5*1024*1024) throw Error('Datei ist größer als 5 MB.');
          const candidate=validateData(JSON.parse(await f.text())); importCandidate=candidate;
          preview.append(node('p','Gültige Datei: '+candidate.sessions.length+' Sitzungen. Der Import ersetzt alle vorhandenen Daten.','notice'));
          preview.append(button('Daten ersetzen',()=>{
            if (!importCandidate || !window.confirm('Alle Gym-Log-Daten durch diese Datei ersetzen?')) return;
            const next=validateData(importCandidate), old=data, prior=storageProblem, oldDrafts=new Map(inputDrafts);
            inputDrafts.clear();
            next.sessions.filter(s=>s.status==='active').forEach(s=>s.exercises.forEach(e=>e.sets.forEach((set,i)=>{ if(set.draftInput)inputDrafts.set(e.id+':'+i,set.draftInput); })));
            data=next; storageProblem='';
            if (!save()) { data=old; inputDrafts.clear(); oldDrafts.forEach((v,k)=>inputDrafts.set(k,v)); storageProblem=prior; say('Import nicht gespeichert. Vorhandene Daten bleiben erhalten.'); return; }
            document.getElementById('storage-message').hidden=true; draft=null; chosenExercise=null; selectedSession=null; historyFilter=''; importCandidate=null; go('home'); say('Daten importiert.');
          },true));
        } catch(error) { preview.append(node('p','Import fehlgeschlagen: '+error.message,'notice')); }
      }); main.append(backup);
    }
    function previewNavigation() {
      document.getElementById('preview-navigation')?.remove();
      if(typeof location==='undefined' || location.protocol!=='file:') return;
      const panel=node('details',undefined,'preview-navigation'); panel.id='preview-navigation';
      panel.open=previewNavOpen;
      panel.addEventListener('toggle',()=>{ previewNavOpen=panel.open; });
      panel.append(node('summary','Vorschau · Navigation'));
      const screens=[['home','Start'],['plan','Plan'],['workout','Training'],['history','Verlauf'],['settings','Einstellungen'],['finish','Abschluss']];
      const jump=target=>{
        if(target==='workout' && !active()) { say('Bitte zuerst auf Start ein Training beginnen.'); return; }
        if(target==='finish') {
          const last=completed()[0]; if(!last) { say('Noch kein abgeschlossenes Training für diese Ansicht.'); return; }
          selectedSession=last.id;
        }
        go(target);
      };
      const links=node('div',undefined,'preview-links');
      screens.forEach(([target,label])=>{
        const control=button(label,()=>jump(target));
        if(target===view) control.setAttribute('aria-current','page');
        links.append(control);
      }); panel.append(links);
      const paging=node('div',undefined,'row');
      for(const [label,delta] of [['← Ansicht',-1],['Ansicht →',1]]) {
        const index=screens.findIndex(([target])=>target===view)+delta;
        const control=button(label,()=>jump(screens[index][0])); control.disabled=index<0 || index>=screens.length; paging.append(control);
      }
      panel.append(paging);
      const session=active();
      if(session) {
        const index=session.exercises.indexOf(currentExercise(session)), exercises=node('div',undefined,'row');
        for(const [label,delta] of [['← Übung',-1],['Übung →',1]]) {
          const control=button(label,()=>{
            const next=session.exercises[index+delta]; if(!next)return;
            session.currentExerciseId=next.id; chosenExercise=next.id; save(); go('workout');
          }); control.disabled=index+delta<0 || index+delta>=session.exercises.length; exercises.append(control);
        }
        panel.append(exercises,node('p',(index+1)+' / '+session.exercises.length+' · '+currentExercise(session).name,'small muted'));
      }
      panel.append(node('p','Nur lokale Vorschau. Navigation schließt keine Sätze ab.','small muted'));
      document.body.append(panel);
    }
    function render() {
      swipeStart=null; document.getElementById('exercise-decision')?.remove();
      document.getElementById('rest-bar')?.remove();
      document.getElementById('workout-bottom')?.remove();
      document.body.classList.toggle('training',view==='workout');
      document.body.classList.toggle('resting',view==='workout' && !!active()?.restEnd);
      main.replaceChildren();
      document.querySelectorAll('nav button').forEach(b=>{ if (b.dataset.view===view || (b.dataset.view==='home' && ['workout','plan','finish'].includes(view))) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
      if (['history','settings'].includes(view)) {
        const back=button('‹ Training',()=>go('home')); back.className='back-home'; main.append(back);
      }
      ({home:showHome,plan:showPlan,workout:showWorkout,finish:showFinish,history:showHistory,settings:showSettings}[view])();
      previewNavigation();
    }
    function tick() {
      const s=active();
      const elapsed=document.getElementById('workout-elapsed');
      if (elapsed && s) { const minutes=Math.floor((Date.now()-s.startTime)/60000); elapsed.textContent=minutes+' Min. Training'; }
      if (!s?.restEnd) return;
      const left=Math.max(0,Math.ceil((s.restEnd-Date.now())/1000));
      const timer=document.getElementById('rest-timer');
      const label=document.getElementById('rest-label');
      if (label) label.textContent=left ? (restLabel(s)) : 'Pause vorbei';
      if (timer) timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
      if (!left) { restAnnounced=true; endRest(s,true); }
    }
    document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
    document.addEventListener('visibilitychange',()=>{ if (!document.hidden) tick(); });
    window.addEventListener('focus',tick);
    if (active()) view='workout';
    if (active()?.restEnd && active().restEnd<=Date.now()) restAnnounced=true;
    render(); tick(); setInterval(tick,1000);
  </script>
</body>
</html>
