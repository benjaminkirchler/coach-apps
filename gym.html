<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Gym Log</title>
  <script id="theme-boot">
    // Apply the saved appearance before first paint; dark is the default.
    (function(){var t='dark';try{var s=localStorage.getItem('gym-theme');if(s==='light'||s==='system'||s==='dark')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    /* Apple-style grouped design. Colours live only in these tokens; dark is the default. */
    :root {
      color-scheme:dark;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
      --bg:light-dark(#F2F2F7,#000000);
      --cell:light-dark(#FFFFFF,#1C1C1E);
      --fill:light-dark(#F2F2F7,#2C2C2E);
      --fill-strong:light-dark(#E5E5EA,#3A3A3C);
      --label:light-dark(#000000,#FFFFFF);
      --label2:light-dark(rgba(60,60,67,.75),rgba(235,235,245,.6));
      --label3:light-dark(rgba(60,60,67,.3),rgba(235,235,245,.3));
      --sep:light-dark(rgba(60,60,67,.29),rgba(84,84,88,.65));
      --accent:light-dark(#FF9500,#FF9F0A);
      --accent-text:light-dark(#C93400,#FF9F0A);
      --on-accent:#000000;
      --danger:light-dark(#FF3B30,#FF453A);
      --danger-text:light-dark(#D70015,#FF453A);
      --bar:light-dark(rgba(249,249,249,.82),rgba(22,22,24,.8));
      --scrim:light-dark(rgba(0,0,0,.3),rgba(0,0,0,.6));
      --shadow:light-dark(rgba(0,0,0,.18),rgba(0,0,0,.6));
      --switch-off:light-dark(#E9E9EA,#39393D);
      --knob:#FFFFFF;
      --thumb:light-dark(#FFFFFF,#636366);
      --heat-0:light-dark(#E5E5EA,#3A3A3C);
      --heat-1:light-dark(#FFE0B3,#5C3B0F);
      --heat-2:light-dark(#FFC266,#8F5A0D);
      --heat-3:light-dark(#FFA733,#CC7F08);
      --heat-4:light-dark(#FF9500,#FF9F0A);
      --heat-0-ink:var(--label);
      --heat-1-ink:light-dark(#000000,#FFFFFF);
      --heat-2-ink:light-dark(#000000,#FFFFFF);
      --heat-3-ink:#000000;
      --heat-4-ink:#000000;
      --sheet:light-dark(#F2F2F7,#1C1C1E);
      --cell-raised:light-dark(#FFFFFF,#2C2C2E);
      --fill-raised:light-dark(#F2F2F7,#3A3A3C);
      --fill-strong-raised:light-dark(#E5E5EA,#48484A);
      --tile-blue:light-dark(#007AFF,#0A84FF);
      --tile-green:light-dark(#34C759,#30D158);
      --tile-grey:#8E8E93;
      --radius:10px;
    }
    :root[data-theme="light"] { color-scheme:light; }
    :root[data-theme="dark"] { color-scheme:dark; }
    :root[data-theme="system"] { color-scheme:light dark; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--bg); }
    body { margin:0; background:var(--bg); color:var(--label); font:17px/1.35 var(--font); -webkit-font-smoothing:antialiased; }
    body.sheet-open { overflow:hidden; }
    .shell { max-width:680px; margin:0 auto; min-width:0; padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(49px + env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-left)); }
    main { min-width:0; }
    h2,h3 { margin:0; }
    p { margin:0 0 16px; }
    small,.muted { color:var(--label2); }
    .small { font-size:14px; }
    button,input,select,textarea { font:inherit; color:inherit; }
    [hidden] { display:none !important; }
    :focus-visible { outline:3px solid var(--accent-text); outline-offset:2px; }
    [tabindex="-1"]:focus,[tabindex="-1"]:focus-visible { outline:none; }

    /* Titles and navigation */
    .large-title { margin:8px 0 14px; font-size:34px; line-height:1.15; font-weight:700; letter-spacing:.37px; }
    .navbar { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; min-height:44px; margin:0 0 8px; }
    .navbar-side { display:flex; align-items:center; min-width:0; }
    .navbar-side.end { justify-content:flex-end; }
    .navbar-title { min-width:0; text-align:center; }
    .navbar-title h2 { margin:0; font-size:17px; line-height:1.2; font-weight:600; overflow-wrap:anywhere; }
    .navbar-title p { margin:0; font-size:12px; line-height:1.3; color:var(--label2); }
    .nav-back,.nav-action { min-height:44px; min-width:44px; padding:0; background:transparent; color:var(--accent); font-weight:400; display:inline-flex; align-items:center; border-radius:8px; }
    .nav-back { gap:2px; margin-left:-8px; padding-right:8px; }
    .nav-back .icon { width:22px; height:22px; flex:none; }
    .nav-action { justify-content:center; }
    .nav-action .icon { width:28px; height:28px; }
    .nav-action.bold { font-weight:600; padding:0 4px; }
    .eyebrow { font-size:13px; text-transform:uppercase; letter-spacing:.2px; color:var(--label2); margin:0 0 6px; }
    .icon { display:block; }
    .chevron { width:8px; height:14px; flex:none; color:var(--label3); }
    .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:center; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-top:.5px solid var(--sep); padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .tabbar button { flex:1; max-width:226px; min-height:49px; padding:6px 4px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:0; background:transparent; color:var(--label2); font-size:11px; font-weight:500; line-height:1.2; }
    .tabbar svg { width:26px; height:26px; }
    .tabbar button[aria-current="page"] { color:var(--accent); }
    body.training .tabbar { display:none; }

    /* Controls */
    button { min-height:50px; padding:0 16px; border:0; border-radius:14px; background:var(--fill-strong); color:var(--accent); font-weight:600; cursor:pointer; text-align:center; touch-action:manipulation; overflow-wrap:anywhere; }
    button:active { opacity:.7; }
    button:disabled { opacity:.4; cursor:default; }
    button.primary { background:var(--accent); color:var(--on-accent); }
    button.plain { background:transparent; min-height:44px; font-weight:400; }
    button.danger { color:var(--danger-text); }
    button.primary.danger { background:var(--danger); color:var(--on-accent); }
    .wide { width:100%; }
    input,select,textarea { font-size:17px; }
    input:not([type=file]):not([type=checkbox]),select,textarea { width:100%; min-height:44px; padding:0 12px; border:0; border-radius:10px; background:var(--fill); color:var(--label); }
    textarea { padding:10px 12px; resize:vertical; min-height:88px; }
    select { appearance:none; -webkit-appearance:none; padding-right:12px; }
    input[type=file] { max-width:100%; color:var(--label2); }
    input[aria-invalid="true"] { outline:2px solid var(--danger); }
    label { display:block; margin:16px 0 7px; font-size:15px; font-weight:600; }
    input.switch { appearance:none; -webkit-appearance:none; flex:none; width:51px; height:31px; min-height:0; padding:0; margin:0; border-radius:16px; background:var(--switch-off); position:relative; cursor:pointer; transition:background .2s; }
    input.switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:var(--knob); box-shadow:0 2px 4px var(--shadow); transition:transform .2s; }
    input.switch:checked { background:var(--accent); }
    input.switch:checked::after { transform:translateX(20px); }
    .segmented { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; padding:2px; border-radius:9px; background:var(--track,var(--fill-strong)); }
    .segmented button { min-height:32px; border-radius:7px; padding:0 8px; background:transparent; color:var(--label); font-size:14px; font-weight:500; }
    .segmented button[aria-pressed="true"] { background:var(--thumb); font-weight:600; box-shadow:0 1px 3px var(--shadow); }

    .notice { padding:12px 16px; background:var(--cell); border-radius:var(--radius); margin:0 0 16px; font-size:15px; }
    #storage-message { margin:12px 0; outline:2px solid var(--danger); }

    /* Inset grouped lists */
    .group { margin:0 0 24px; }
    .group-header { margin:0 0 7px 16px; font-size:13px; font-weight:400; line-height:1.3; text-transform:uppercase; letter-spacing:.2px; color:var(--label2); }
    .group-footer { margin:8px 16px 0; font-size:13px; line-height:1.35; color:var(--label2); }
    .list { background:var(--cell); border-radius:var(--radius); overflow:hidden; }
    .list > * { position:relative; }
    .list > * + *::before { content:""; position:absolute; top:0; left:16px; right:0; height:.5px; background:var(--sep); }
    .row-btn,.row-item { display:flex; align-items:center; gap:12px; width:100%; min-height:44px; margin:0; padding:10px 16px; border-radius:0; background:transparent; color:var(--label); font-size:17px; font-weight:400; text-align:left; }
    .row-btn:active { background:var(--fill-strong); opacity:1; }
    .row-btn.accent { color:var(--accent); }
    .row-btn.danger { color:var(--danger-text); }
    .row-label { flex:1; min-width:0; overflow-wrap:anywhere; }
    .row-detail { color:var(--label2); text-align:right; font-variant-numeric:tabular-nums; }
    .row-item > .row-label { font-size:17px; }
    .row-item > .row-label { flex:0 1 auto; }
    .row-item input:not(.switch),.row-item select { width:auto; flex:1 1 0; min-width:72px; text-align:right; background:transparent; padding:0; min-height:32px; }
    .row-item select { text-align-last:right; }
    .row-item .segmented { flex:1; }
    .row-stack { display:block; padding:10px 16px; }
    .row-stack p { margin:0; }
    .row-text { padding:12px 16px; font-size:15px; color:var(--label2); }
    .row-text p { margin:0; }
    .card { padding:16px; border-radius:14px; background:var(--cell); margin:0 0 16px; }
    .card h3 { font-size:20px; font-weight:600; margin-bottom:8px; }
    .stack { display:grid; gap:12px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .row > * { flex:1; }
    .item { padding:12px 0; border-bottom:.5px solid var(--sep); }
    .item:last-child { border-bottom:0; }
    a { color:var(--accent-text); }
    .uncertain { border-left:4px solid var(--accent); padding-left:10px; }

    /* Home */
    .training-hero { padding:16px 20px 20px; margin:0 0 12px; border-radius:16px; }
    .training-hero .eyebrow { color:var(--label2); font-weight:400; margin-bottom:8px; }
    .training-hero h3 { font-size:28px; line-height:1.15; font-weight:700; letter-spacing:.3px; margin:0 0 16px; }
    .training-hero p { margin:0 0 16px; color:var(--label2); }
    .training-hero button { width:100%; }
    .training-hero > button + button { margin-top:4px; }
    .training-hero ~ .plain,.home-secondary { width:100%; margin-bottom:16px; }
    .muscle-home { margin:0 0 16px; }
    .muscle-heading { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
    .muscle-heading h3 { margin:0; font-size:20px; }
    .body-pair { display:grid; grid-template-columns:1fr 1fr; max-width:390px; margin:8px auto; }
    .body-pair figure { margin:0; min-width:0; text-align:center; }
    .body-pair svg { width:100%; height:min(31svh,270px); min-height:210px; display:block; }
    .body-pair figcaption { font-size:12px; color:var(--label2); }
    .body-pair g[role=button] { cursor:pointer; }
    .body-pair g[role=button]:focus { outline:none; }
    .body-pair g[role=button]:focus path { stroke:var(--label); stroke-width:3; }
    .body-pair path { stroke:var(--cell); stroke-width:1.5; }
    .body-pair path.silhouette { fill:var(--fill); stroke:var(--sep); stroke-width:1; }
    .heat-0 { fill:var(--heat-0); } .heat-1 { fill:var(--heat-1); } .heat-2 { fill:var(--heat-2); } .heat-3 { fill:var(--heat-3); } .heat-4 { fill:var(--heat-4); }
    .muscle-legend { display:flex; justify-content:center; gap:4px; margin:12px 0 6px; }
    .muscle-legend span { min-width:48px; padding:2px 5px; border-radius:5px; text-align:center; font-size:12px; }
    .heat-bg-0 { background:var(--heat-0); color:var(--heat-0-ink); } .heat-bg-1 { background:var(--heat-1); color:var(--heat-1-ink); } .heat-bg-2 { background:var(--heat-2); color:var(--heat-2-ink); } .heat-bg-3 { background:var(--heat-3); color:var(--heat-3-ink); } .heat-bg-4 { background:var(--heat-4); color:var(--heat-4-ink); }
    .muscle-home > p { text-align:center; margin:6px 0 0; font-size:12px; }
    .muscle-detail { color:var(--accent-text); font-weight:600; }

    /* Focus */
    .split-tabs { margin:8px 0 16px; }
    .muscle-chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 24px; }
    .muscle-chips button { font-size:15px; min-height:36px; padding:0 14px; border-radius:18px; font-weight:500; background:var(--cell); color:var(--label); }
    .muscle-chips [aria-pressed=true] { background:var(--accent); color:var(--on-accent); }
    .list > .focus-exercise { display:flex; gap:12px; align-items:center; justify-content:space-between; min-height:60px; margin:0; padding:10px 16px; font-weight:400; font-size:17px; cursor:pointer; }
    .focus-exercise span { display:grid; gap:2px; min-width:0; }
    .focus-exercise small { font-size:13px; font-weight:400; }
    .focus-plan-preview { margin:0 0 24px; }
    .focus-plan-preview > button { width:100%; margin-top:16px; }
    .focus-plan-preview .row-item { font-size:15px; }

    /* Training */
    .workout-header { position:sticky; top:0; z-index:3; margin:0 -16px 8px; padding:0 16px; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); }
    .workout-header .navbar-title { padding:2px 0; }
    #workout-elapsed { font-variant-numeric:tabular-nums; }
    body.training .shell { padding-top:max(0px,env(safe-area-inset-top)); padding-bottom:0; }
    body.training main { display:flex; flex-direction:column; min-height:100svh; touch-action:pan-y pinch-zoom; }
    body.training .eyebrow { margin:8px 16px 6px; }
    .exercise-card { padding:16px 16px 12px; margin:0 0 8px; scroll-margin-top:100px; }
    .exercise-card h3 { font-size:28px; line-height:1.15; font-weight:700; letter-spacing:.3px; margin:0 0 2px; }
    .exercise-card > p { margin:0 0 8px; color:var(--label2); font-size:15px; }
    .current-set { min-height:0; }
    .set-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; align-items:center; margin:0; padding:4px 0; font-size:14px; }
    .set-grid > :first-child,.set-grid > .previous,.set-grid > .goal { display:none; }
    .set-grid label { margin:0; font-size:14px; line-height:20px; font-weight:500; color:var(--label2); text-align:center; }
    .set-grid .weight-label { display:block; grid-column:1; grid-row:1; }
    .set-grid .reps-label { display:block; grid-column:2; grid-row:1; }
    .set-grid input { grid-row:2; min-width:0; text-align:center; font-size:28px; font-weight:600; min-height:56px; }
    .set-grid .bodyweight-value { grid-column:1; grid-row:2; font-size:16px; align-self:center; text-align:center; color:var(--label2); }
    .set-grid > button { grid-column:1 / -1; grid-row:3; width:100%; margin-top:8px; }
    .set-grid.is-done { background:transparent; }
    .set-adjuster { grid-column:1 / -1; padding:10px; background:var(--fill); border-radius:10px; }
    .set-adjuster p { margin:0 0 8px; font-size:14px; }
    .set-adjuster .row { flex-wrap:nowrap; gap:6px; }
    .set-adjuster button { min-width:48px; min-height:44px; }
    .manual-values .set-adjuster { grid-row:4; }
    .active-set { position:relative; }
    .active-set::before { content:""; position:absolute; left:0; right:0; top:158px; height:44px; border-radius:10px; background:var(--fill); }
    .active-set.manual-values::before { display:none; }
    .value-wheel { display:none; }
    .active-set .value-wheel { display:block; position:relative; z-index:1; grid-row:2; height:308px; overflow-y:auto; overscroll-behavior-y:contain; scroll-snap-type:y mandatory; padding:132px 0; border-radius:10px; scrollbar-width:none; touch-action:pan-y; -webkit-mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent); mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent); }
    .value-wheel::-webkit-scrollbar { display:none; }
    .value-wheel.weight-wheel { grid-column:1; }
    .value-wheel.reps-wheel { grid-column:2; }
    .wheel-option { height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0; scroll-snap-align:center; font-size:22px; font-variant-numeric:tabular-nums; color:var(--label2); cursor:pointer; }
    .wheel-option[aria-selected="true"] { color:var(--label); font-size:26px; font-weight:600; }
    .active-set input { display:none; }
    .active-set.manual-values input { display:block; }
    .active-set.manual-values .value-wheel { display:none; }
    .active-set > button { display:none; }
    .set-history.list > .set-grid { padding:12px 16px; }
    .set-history .set-grid > :first-child { display:block; grid-column:1 / -1; font-size:15px; font-weight:600; }
    .set-history .set-grid .weight-label,.set-history .set-grid .reps-label { grid-row:2; }
    .set-history .set-grid input { grid-row:3; font-size:20px; min-height:44px; }
    .set-history .set-grid > button { grid-row:4; }
    .set-history .bodyweight-value { grid-row:3; }
    .workout-actions { display:grid; gap:8px; margin:0; }
    #next-exercise { width:100%; }
    .workout-bottom { position:sticky; bottom:0; z-index:3; display:flex; flex-direction:column; gap:8px; margin:auto -16px 0; padding:10px 16px max(12px,env(safe-area-inset-bottom)); background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-top:.5px solid var(--sep); }
    .workout-bottom p { margin:0; font-size:13px; color:var(--label2); }
    .workout-bottom progress { width:100%; height:4px; appearance:none; -webkit-appearance:none; border:0; border-radius:2px; background:var(--fill-strong); overflow:hidden; }
    .workout-bottom progress::-webkit-progress-bar { background:var(--fill-strong); }
    .workout-bottom progress::-webkit-progress-value { background:var(--accent); border-radius:2px; }
    .workout-bottom progress::-moz-progress-bar { background:var(--accent); }
    #complete-set { width:100%; }
    .workout-bottom:focus { outline:none; }

    /* Rest screen */
    .rest-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; min-width:0; padding:24px 0 32px; text-align:center; }
    .rest-screen p { margin:0; }
    .rest-screen .eyebrow { text-transform:none; letter-spacing:0; font-size:17px; margin:0; }
    .rest-clock { color:var(--label); font-size:64px; font-weight:200; line-height:1; letter-spacing:0; white-space:nowrap; }
    .rest-preview { display:grid; gap:4px; max-width:28ch; color:var(--label2); font-size:16px; line-height:1.4; overflow-wrap:anywhere; }
    .rest-adjust { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(100%,280px); }
    .rest-adjust button { min-height:44px; border-radius:22px; }
    #rest-skip { width:100%; }
    body.resting .exercise-card,body.resting .workout-actions,body.resting main > .eyebrow,body.resting #complete-set,body.resting #workout-overview { display:none !important; }
    body.resting .rest-screen { order:1; }
    body.resting .workout-bottom { order:2; }

    /* Bottom sheets */
    .sheet-backdrop { position:fixed; inset:0; z-index:30; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity .3s ease,visibility 0s linear .3s; }
    .sheet-backdrop.open { opacity:1; visibility:visible; transition-delay:0s; }
    .sheet { --cell:var(--cell-raised); --fill:var(--fill-raised); --fill-strong:var(--fill-strong-raised); position:fixed; left:0; right:0; bottom:0; z-index:31; width:min(100%,680px); height:min(88svh,780px); margin:0 auto; display:flex; flex-direction:column; border-radius:20px 20px 0 0; background:var(--sheet); color:var(--label); box-shadow:0 -8px 40px var(--shadow); transform:translateY(100%); visibility:hidden; transition:transform .35s cubic-bezier(.32,.72,0,1),visibility 0s linear .35s; overflow:hidden; }
    .sheet.open { transform:none; visibility:visible; transition-delay:0s; }
    .grabber { flex:none; width:36px; height:5px; margin:6px auto 0; border-radius:3px; background:var(--label3); }
    .sheet-page { display:flex; flex-direction:column; min-height:0; flex:1; }
    .sheet-bar { flex:none; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; min-height:48px; padding:0 16px; }
    .sheet-title { margin:0; font-size:17px; font-weight:600; text-align:center; }

      if(!['workout','home','focus'].includes(view) || event.isPrimary===false || (event.pointerType==='mouse' && event.button!==0))return;
      if(event.target.closest?.('input,textarea,select,button,a,summary,.value-wheel,dialog,.sheet,g[role=button]'))return;
      swipeStart={x:event.clientX,y:event.clientY,id:event.pointerId,time:Date.now()};
    });
    main.addEventListener('pointercancel',()=>{swipeStart=null;});
    main.addEventListener('pointerup',event=>{
      const start=swipeStart; swipeStart=null;
      if(!start || start.id!==event.pointerId || !['workout','home','focus'].includes(view) || Date.now()-start.time>1200)return;
      const dx=event.clientX-start.x,dy=event.clientY-start.y;
      if(Math.abs(dx)<80 || Math.abs(dx)<Math.abs(dy)*1.8)return;
      if(view==='home') { if(dx<0)go('focus'); return; }
      if(view==='focus') { if(dx>0)go('home'); return; }
      if(dx>0)go('home'); else requestNextExercise();
    });
    function nextExercise(s,e) {
      const index=s.exercises.indexOf(e);
      const ordered=[...s.exercises.slice(index+1),...s.exercises.slice(0,index)];
      const others=ordered.filter(x=>pending(x)>=0);
      return others.find(x=>!x.deferred) || others[0] || null;
    }
    function nextLabel(s,e) { const next=nextExercise(s,e); return next?'Weiter zu '+next.name:pending(e)>=0?'Training beenden':'Training abschließen'; }
    function openExercise(s,e,resume=true) {
      s.currentExerciseId=e.id; chosenExercise=e.id; if(resume)e.deferred=false; save(); render();
      main.querySelector('h2')?.focus();
    }
    function deferExercise(s,e) {
      e.deferred=true;
      const next=nextExercise(s,e);
      if(next && !next.deferred) { openExercise(s,next,false); say(e.name+' bleibt für später offen.'); }
      else { save(); render(); say('Alle offenen Übungen sind zurückgestellt. Wähle ein freies Gerät im Plan oder beende das Training.'); }
    }
    function skipExercise(s,e,confirmSkip=true) {
      if (confirmSkip && !window.confirm('Offene Sätze von '+e.name+' auslassen? Du kannst sie in der Übersicht später wieder öffnen. XP-Abzüge gelten erst mit Trainerregeln.')) return;
      e.sets.forEach(set=>{ if(set.status==='planned') set.status='skipped'; }); e.deferred=false;
      const next=nextExercise(s,e);
      if(next) { s.currentExerciseId=next.id; chosenExercise=next.id; }
      else { finishWorkout(s); return; }
      save(); render(); say(e.name+' ausgelassen.');
    }
    function finishWorkout(s,confirmOpen=true) {
      for (const e of s.exercises) for (let i=0;i<e.sets.length;i++) {
        const cached=inputDrafts.get(e.id+':'+i);
        if (e.sets[i].status==='completed' && cached && (parseReps(cached.r)===null || (!bodyweight(e.name) && parseWeight(cached.w)===null))) {
          say('Bitte ungültige Eingaben bei '+e.name+' Satz '+(i+1)+' korrigieren.');
          document.getElementById('exercise-'+e.id)?.scrollIntoView({block:'start'}); return;
        }
      }
      const open=s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.status==='planned').length,0);
      if (open && confirmOpen && !window.confirm(open+' offene Sätze als übersprungen markieren und Training beenden?')) return;
      s.exercises.forEach(e=>e.sets.forEach(x=>{ if (x.status==='planned') x.status='skipped'; }));
      s.status='completed'; s.endTime=Date.now(); s.restEnd=null; inputDrafts.clear(); save(); selectedSession=s.id; go('finish');
    }
    // Plain-text summary for asking a chat coach mid-workout; completed sets only count as done.
    function workoutSummary(s) {
      const minutes=Math.floor((Date.now()-s.startTime)/60000), lines=[];
      lines.push('Mein Training heute: '+data.settings.templates[s.type].name+', '+dateLabel(s.date)+', seit '+minutes+' Min.');
      const open=[];
      for (const e of s.exercises) {
        if (!e.sets.some(x=>x.status!=='planned')) { open.push(e.name); continue; }
        const sets=e.sets.map(x=>x.status==='completed' ? setText(x,e.name,true)+(x.rating?' ('+x.rating+')':'') : x.status==='skipped' ? 'ausgelassen' : 'offen, Ziel '+setText(x,e.name));
        lines.push(e.name+': '+sets.join(' · ')+(e.note?' · Notiz: '+e.note:''));
      }
      if (open.length) lines.push('Noch nicht begonnen: '+open.join(', '));
      lines.push('','Wie soll ich den Rest anpassen? Heute fühle ich mich: ');
      return lines.join('\n');
    }
    async function shareWorkout(s) {
      const text=workoutSummary(s);
      if (navigator.share) {
        try { await navigator.share({title:'Mein Training',text}); return; }
        catch (error) { if (error.name==='AbortError') return; }
      }
      try { await navigator.clipboard.writeText(text); say('Training kopiert. In ChatGPT oder Claude einfügen.'); return; } catch {}
      const box=node('textarea'); box.value=text; box.readOnly=true; box.rows=8; box.setAttribute('aria-label','Training zum Kopieren');
      main.append(box); box.focus(); box.select(); say('Text markiert. Kopieren und im Chat einfügen.');
    }

        page(id,heading,parent) {
          const el=node('div',undefined,'sheet-page'); el.hidden=id!=='root';
          const bar=node('div',undefined,'sheet-bar'), left=node('div',undefined,'navbar-side'), right=node('div',undefined,'navbar-side end');

          const h=node('h3',heading,'sheet-title'); h.tabIndex=-1;

          bar.append(left,h,right);

        },
        show(id) { pages.forEach((page,key)=>{ page.el.hidden=key!==id; }); pages.get(id)?.title.focus(); },
        open() { if (isOpen) return; isOpen=true; sheet.className='sheet open'; backdrop.className='sheet-backdrop open'; document.body.classList.toggle('sheet-open',true); ui.show('root'); },
        close() { if (!isOpen) return; isOpen=false; sheet.className='sheet'; backdrop.className='sheet-backdrop'; document.body.classList.toggle('sheet-open',false); trigger?.focus(); ui.onClose?.(); }
      };
      backdrop.addEventListener('click',()=>ui.close());
      sheet.addEventListener('keydown',event=>{ if (event.key==='Escape') { event.preventDefault?.(); ui.close(); } });
      ui.page('root',rootTitle);
      return ui;
    }

    function duration(s) {
      if (s.startTime===null || s.endTime===null) return 'unbekannt';
      const minutes=Math.floor((s.endTime-s.startTime)/60000);
      return minutes>=60 ? Math.floor(minutes/60)+' Std. '+minutes%60+' Min.' : minutes+' Min.';
    }
    function sessionStats(s) {
      let done=0,total=0,volume=0;
      s.exercises.forEach(e=>e.sets.forEach(x=>{ total++; if (x.status==='completed') { done++; if (x.actualWeight!==null && x.actualReps!==null) volume+=x.actualReps*x.actualWeight; } }));
      return {done,total,volume:Math.round(volume*10)/10};
    }
    function statRows(list,s) {
      const st=sessionStats(s);
      list.append(listRow('Dauer',null,duration(s)));
      list.append(listRow('Sätze',null,st.done+' von '+st.total));
      if (st.volume>0) list.append(listRow('Volumen',null,st.volume.toLocaleString('de-DE')+' kg'));
    }
    function changes(e,s) {
      const old=previous(e.name,s.id);
      if (!old) return 'Kein früherer Vergleich.';
      return e.sets.map((x,i)=>x.status==='completed' ? 'Satz '+(i+1)+': '+compare(x,old.exercise.sets[i]) : null).filter(Boolean).join(' ') || 'Keine sicheren Vergleiche.';
    }
    function showFinish() {
      const s=data.sessions.find(x=>x.id===selectedSession && x.status==='completed'); if (!s) { go('home'); return; }
      title('Geschafft');
      const [y,m,d]=s.date.split('-').map(Number);
      main.append(node('p',data.settings.templates[s.type].name+' · '+new Date(y,m-1,d,12).toLocaleDateString('de-AT',{day:'numeric',month:'short'}),'large-subtitle'));
      const summary=group(undefined,s.xpRules?xpLabel(s):undefined);
      summary.list.append(listRow('Übungen',null,String(s.exercises.length)));
      statRows(summary.list,s);
      main.append(summary);
      const noteGroup=group('Notiz'); const note=node('textarea'); note.value=s.note; note.maxLength=1000; note.placeholder='Wie lief es?'; note.setAttribute('aria-label','Kurze Notiz (optional)'); note.id='finish-note';
      noteGroup.list.append(note); main.append(noteGroup);
      main.append(button('Speichern und zur Startseite',()=>{ s.note=note.value.trim(); save(); go('home'); },true));
      const more=group(); more.list.append(listButton('Training ansehen',()=>{ historyFilter=''; go('history'); },{nav:true,icon:['blue',GLYPH.list]}),listButton('Backup teilen / herunterladen',backupData,{icon:['grey',GLYPH.share]}));
      main.append(node('div',undefined,'spacer'),more);
    }
    function correction(s,e,set,i) {
      const box=node('div',undefined,'correction'), panel=node('div',undefined,'plan-edit'); panel.hidden=true;
      const value=set.status==='skipped' || set.status==='planned' ? 'Übersprungen' : (set.status==='uncertain' ? 'Unsicher · ' : '')+setText(set,e.name,true);
      const head=listButton('Satz '+(i+1),()=>{ const open=panel.hidden; panel.hidden=!open; head.setAttribute('aria-expanded',String(open)); },{nav:true,detail:value});
      head.setAttribute('aria-expanded','false');
      const status=selectRow(panel,'Status',[['completed','Geschafft'],['uncertain','Unsicher'],['skipped','Übersprungen']],set.status==='planned'?'skipped':set.status);
      const r=inputRow(panel,'Wiederholungen',set.actualReps===null?'':String(set.actualReps),{mode:'numeric'});
      const w=bodyweight(e.name)?null:inputRow(panel,'Gewicht (kg)',set.actualWeight===null?'':amount(set.actualWeight),{mode:'decimal'});
      const rating=selectRow(panel,'Bewertung',[['','Ohne Bewertung'],['leicht','Leicht'],['mittel','Mittel'],['schwer','Schwer']],set.rating || '');
      panel.append(listButton('Korrektur speichern',()=>{
        const nr=r.value.trim()?parseReps(r.value):null, nw=w && w.value.trim()?parseWeight(w.value):null;
        if ((r.value.trim() && nr===null) || (w && w.value.trim() && nw===null) || (status.value==='completed' && (nr===null || (w && nw===null)))) { say('Ungültige oder fehlende Ist-Werte.'); return; }
        set.changes.push({at:Date.now(),status:set.status,actualReps:set.actualReps,actualWeight:set.actualWeight,rating:set.rating,timestamp:set.timestamp,source:set.source});
        set.status=status.value; set.actualReps=status.value==='skipped'?null:nr; set.actualWeight=status.value==='skipped'?null:nw;
        set.rating=status.value==='skipped'?null:(rating.value || null); set.timestamp=status.value==='skipped'?null:set.timestamp; set.source='manual_correction';
        save(); render(); say('Korrektur mit ursprünglichem Wert gespeichert.');
      },{tone:'accent'}));
      if (set.changes.length) panel.append(node('p',set.changes.map((change,j)=>(j===0?'Original':'Vorher')+': '+statusWord(change.status)+' · '+setText(change,e.name,true)+' ('+timeLabel(change.at)+')').join('\n'),'group-footer correction-log'));
      box.append(head,panel); return box;
    }
    function nutritionHistory() {

    function download(filename='gym-log-'+today()+'.json') {
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=node('a');
      a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    const BACKUP_KEY='gym-backup-time';
    function backupStatus() {
      try { const saved=localStorage.getItem(BACKUP_KEY); return saved ? 'Zuletzt geteilt / heruntergeladen: '+new Date(Number(saved)).toLocaleString('de-AT') : 'Noch keine Sicherung'; }
      catch { return 'Noch keine Sicherung'; }
    }
    async function backupData() {
      const name='gym-backup-'+today()+'.json';
      const file=new File([JSON.stringify(data,null,2)],name,{type:'application/json'});
      const mark=()=>{ try { localStorage.setItem(BACKUP_KEY,String(Date.now())); } catch {} document.querySelectorAll('.backup-status').forEach(x=>{ x.textContent=backupStatus(); }); };
      if (navigator.canShare && navigator.canShare({files:[file]}) && navigator.share) {
        try { await navigator.share({files:[file],title:name}); mark(); return; }
        catch (error) { if (error.name==='AbortError') return; }
      }
      download(name); mark();
    }
    function allExerciseNames() { return [...new Set([...DEFAULTS.upper,...DEFAULTS.lower,...EXTRA,...data.settings.templates.upper.exercises,...data.settings.templates.lower.exercises,...data.sessions.flatMap(s=>s.exercises.map(e=>e.name))])].sort((a,b)=>a.localeCompare(b,'de')); }
    function showExerciseSettings() {
      if (typeof settingsSub==='string' && settingsSub!=='exercises') {
        const name=settingsSub;
        navbar(name,{label:'Pro Übung',action:()=>{ settingsSub='exercises'; render(); }});
        const pause=group('Pause','Gilt für Pausen nach Sätzen dieser Übung.');
        numberRow(pause.list,'Satzpause',data.settings.exerciseRestSeconds[name] || data.settings.restSeconds,'s','numeric',text=>{ const n=Number(text); if (!/^\d+$/.test(text) || n<15 || n>900) { say('Bitte 15 bis 900 Sekunden eingeben.'); return null; } data.settings.exerciseRestSeconds[name]=n; save(); say('Pause gespeichert.'); return n; });
        if (data.settings.exerciseRestSeconds[name]) pause.list.append(listButton('Standardpause verwenden',()=>{ delete data.settings.exerciseRestSeconds[name]; save(); render(); },{tone:'accent'}));
        main.append(pause);
        if (!bodyweight(name)) {
          const steps=group('Gewichtsschritt','Schrittweite der Gewichtsauswahl.');
          numberRow(steps.list,'Schritt',step(name),'kg','decimal',text=>{ const n=parseWeight(text); if (n===null || n<=0) { say('Bitte einen positiven Gewichtsschritt eingeben.'); return null; } data.settings.steps[name]=n; save(); say('Gewichtsschritt gespeichert.'); return n; });
          main.append(steps);
        }
        return;
      }
      navbar('Pro Übung',{label:'Einstellungen',action:()=>{ settingsSub=null; render(); }});
      const list=group(undefined,'Wähle eine Übung für eigene Pausen- und Gewichtswerte.');
      allExerciseNames().forEach(n=>list.list.append(listButton(n,()=>{ settingsSub=n; render(); main.querySelector('h2')?.focus(); },{nav:true})));
      main.append(list);
    }
    function showSettings() {
      if (settingsSub) { showExerciseSettings(); return; }
      title('Einstellungen');
      const look=group('Erscheinungsbild','Dunkel ist die Standardeinstellung. „System“ folgt der Einstellung deines iPhones.');
      const lookRow=node('div',undefined,'row-item');
      lookRow.append(segmented([['dark','Dunkel'],['light','Hell'],['system','System']],theme,setTheme,'Erscheinungsbild'));
      look.list.append(lookRow); main.append(look);

      const seconds=(apply,message)=>text=>{ const n=Number(text); if (!/^\d+$/.test(text) || !Number.isInteger(n) || n<15 || n>900) { say('Bitte 15 bis 900 Sekunden eingeben.'); return null; } apply(n); save(); say(message); return n; };
      const rest=group('Pausen','Pause nach einem bestätigten Satz bzw. beim Wechsel zur nächsten Übung, 15 bis 900 Sekunden.');
      numberRow(rest.list,'Zwischen Sätzen',data.settings.restSeconds,'s','numeric',seconds(n=>{ data.settings.restSeconds=n; },'Pause gespeichert.'));
      numberRow(rest.list,'Zwischen Übungen',data.settings.betweenExerciseRestSeconds,'s','numeric',seconds(n=>{ data.settings.betweenExerciseRestSeconds=n; },'Pause zwischen Übungen gespeichert.'));
      main.append(rest);
      const perExercise=group('Übungen','Satzpause und Gewichtsschritt für einzelne Geräte.');
      perExercise.list.append(listButton('Pro Übung',()=>{ settingsSub='exercises'; render(); main.querySelector('h2')?.focus(); },{nav:true}));
      main.append(perExercise);

      const food=group('Ernährung');
      for (const [key,label] of [['proteinTarget','Protein-Ziel pro Tag'],['scoopGrams','Shake-Portion'],['proteinPerScoop','Protein pro Portion'],['creatineDose','Kreatin-Dosis']]) {
        numberRow(food.list,label,data.settings[key],'g','decimal',text=>{ const n=Number(text.replace(',','.')); if (!text || !Number.isFinite(n) || n<=0 || n>300 || (key==='creatineDose' && n>100)) { say('Bitte gültige positive Mengen eingeben.'); return null; } data.settings[key]=n; save(); say('Ernährungswerte gespeichert.'); return n; });
      }
      main.append(food);

      const xpBox=group('Trainer · XP-Regeln','Freigegebene Regeln als JSON importieren. Laufende und abgeschlossene Trainings behalten ihre bisherigen Regeln.');
      xpBox.list.append(listText(data.settings.xpRules?'Für neue Trainings: '+data.settings.xpRules.ruleVersion:'Noch keine freigegebenen Regeln. XP bleiben offen.'));
      const xpFile=node('input'); xpFile.type='file'; xpFile.accept='.json,application/json'; xpFile.id='xp-file'; xpFile.setAttribute('aria-label','Trainerregeln importieren');
      xpBox.list.append(listRow('Trainerregeln importieren',xpFile));
      const xpPreview=node('div',undefined,'import-preview'); xpBox.append(xpPreview);
      xpFile.addEventListener('change',async()=>{
        xpPreview.replaceChildren(); const file=xpFile.files[0]; if(!file)return;
        try {
          if(file.size>1024*1024)throw Error('Datei ist zu groß.');
          const rules=validateXpRules(JSON.parse(await file.text())); if(!rules)throw Error('Regeln fehlen.');
          xpPreview.append(node('p','Version '+rules.ruleVersion+' · Freigabe: '+rules.approvedBy+' · '+rules.approvedAt,'group-footer'));
          xpPreview.append(button('Freigegebene Regeln für neue Trainings übernehmen',()=>{data.settings.xpRules=rules;save();render();say('Trainerregeln für neue Trainings gespeichert.');},true));
        } catch(error) { xpPreview.append(node('p','Import fehlgeschlagen: '+error.message,'notice')); }
      }); main.append(xpBox);

      for (const key of ['upper','lower']) {
        const t=data.settings.templates[key], box=group('Vorlage · '+t.name);
        const name=inputRow(box.list,'Name',t.name); name.maxLength=60;
        name.addEventListener('change',()=>{ if (!name.value.trim()) { say('Name fehlt.'); name.value=t.name; return; } t.name=name.value.trim(); save(); render(); });
        t.exercises.forEach((e,i)=>{
          const item=node('div',undefined,'row-stack');
          const rename=node('input'); rename.value=e; rename.maxLength=80; rename.setAttribute('aria-label',(i+1)+'. Übung umbenennen');
          rename.addEventListener('change',()=>{ const n=rename.value.trim(); if (!n || (n!==e && t.exercises.includes(n))) { say('Ungültiger oder doppelter Name.'); rename.value=e; return; } t.exercises[i]=n; save(); render(); });
          const row=node('div',undefined,'row mini');
          row.append(button('Hoch',()=>{ move(t.exercises,i,-1); save(); render(); },'plain'),button('Runter',()=>{ move(t.exercises,i,1); save(); render(); },'plain'),button('Entfernen',()=>{ t.exercises.splice(i,1); save(); render(); },'plain danger'));
          item.append(rename,row); box.list.append(item);
        });
        main.append(box);
        addExercise(main,n=>{ if (t.exercises.includes(n)) { say('Übung steht bereits in der Vorlage.'); return; } t.exercises.push(n); save(); render(); });
      }

      const backup=group('Daten','Alle Daten als JSON sichern oder eine Sicherung einschließlich unsicherer Sätze importieren.');
      backup.list.append(listButton('JSON exportieren',()=>download(),{tone:'accent'}),listButton('Backup teilen / herunterladen',backupData,{tone:'accent'}));
      const status=listText(backupStatus()); status.children[0].className='backup-status'; backup.list.append(status);
      const file=node('input'); file.type='file'; file.accept='.json,application/json'; file.id='import-file'; file.setAttribute('aria-label','JSON importieren');
      backup.list.append(listRow('JSON importieren',file));
      const preview=node('div',undefined,'import-preview'); backup.append(preview);
      file.addEventListener('change',async()=>{
        preview.replaceChildren(); importCandidate=null; const f=file.files[0]; if (!f) return;
        try {
          if (f.size>5*1024*1024) throw Error('Datei ist größer als 5 MB.');
          const candidate=validateData(JSON.parse(await f.text())); importCandidate=candidate;
          preview.append(node('p','Gültige Datei: '+candidate.sessions.length+' Sitzungen. Der Import ersetzt alle vorhandenen Daten.','notice'));
          preview.append(button('Daten ersetzen',()=>{
            if (!importCandidate || !window.confirm('Alle Gym-Log-Daten durch diese Datei ersetzen?')) return;
            const next=validateData(importCandidate), old=data, prior=storageProblem, oldDrafts=new Map(inputDrafts);
            inputDrafts.clear();
            next.sessions.filter(s=>s.status==='active').forEach(s=>s.exercises.forEach(e=>e.sets.forEach((set,i)=>{ if(set.draftInput)inputDrafts.set(e.id+':'+i,set.draftInput); })));
            data=next; storageProblem='';
            if (!save()) { data=old; inputDrafts.clear(); oldDrafts.forEach((v,k)=>inputDrafts.set(k,v)); storageProblem=prior; say('Import nicht gespeichert. Vorhandene Daten bleiben erhalten.'); return; }
            document.getElementById('storage-message').hidden=true; draft=null; chosenExercise=null; selectedSession=null; historyFilter=''; importCandidate=null; go('home'); say('Daten importiert.');
          },'danger'));
        } catch(error) { preview.append(node('p','Import fehlgeschlagen: '+error.message,'notice')); }
      }); main.append(backup);
    }
    function previewNavigation() {
      document.getElementById('preview-navigation')?.remove();
      if(typeof location==='undefined' || location.protocol!=='file:') return;
      const panel=node('details',undefined,'preview-navigation'); panel.id='preview-navigation';
      panel.open=previewNavOpen;
      panel.addEventListener('toggle',()=>{ previewNavOpen=panel.open; });
      panel.append(node('summary','Vorschau · Navigation'));
      const screens=[['home','Start'],['focus','Fokus'],['plan','Plan'],['workout','Training'],['history','Verlauf'],['settings','Einstellungen'],['finish','Abschluss']];
      const jump=target=>{
        if(target==='workout' && !active()) { say('Bitte zuerst auf Start ein Training beginnen.'); return; }
        if(target==='finish') {
          const last=completed()[0]; if(!last) { say('Noch kein abgeschlossenes Training für diese Ansicht.'); return; }
          selectedSession=last.id;
        }
        go(target);
      };
      const links=node('div',undefined,'preview-links');
      screens.forEach(([target,label])=>{
        const control=button(label,()=>jump(target));
        if(target===view) control.setAttribute('aria-current','page');
        links.append(control);
      }); panel.append(links);
      const paging=node('div',undefined,'row');
      for(const [label,delta] of [['← Ansicht',-1],['Ansicht →',1]]) {
        const index=screens.findIndex(([target])=>target===view)+delta;
        const control=button(label,()=>jump(screens[index][0])); control.disabled=index<0 || index>=screens.length; paging.append(control);
      }
      panel.append(paging);
      const session=active();
      if(session) {
        const index=session.exercises.indexOf(currentExercise(session)), exercises=node('div',undefined,'row');
        for(const [label,delta] of [['← Übung',-1],['Übung →',1]]) {
          const control=button(label,()=>{
            const next=session.exercises[index+delta]; if(!next)return;
            session.currentExerciseId=next.id; chosenExercise=next.id; save(); go('workout');
          }); control.disabled=index+delta<0 || index+delta>=session.exercises.length; exercises.append(control);
        }
        panel.append(exercises,node('p',(index+1)+' / '+session.exercises.length+' · '+currentExercise(session).name,'small muted'));
      }
      panel.append(node('p','Nur lokale Vorschau. Navigation schließt keine Sätze ab.','small muted'));
      document.body.append(panel);
    }
    function render() {
      swipeStart=null; document.getElementById('exercise-decision')?.remove();
      document.getElementById('rest-bar')?.remove();
      document.getElementById('workout-bottom')?.remove();
      document.body.classList.toggle('sheet-open',false);
      document.body.classList.toggle('training',view==='workout');
      document.body.classList.toggle('pushed',['plan','focus'].includes(view) || (view==='history' && !!selectedSession) || (view==='settings' && !!settingsSub));
      document.body.classList.toggle('resting',view==='workout' && !!active()?.restEnd);
      main.replaceChildren();
      document.querySelectorAll('nav button').forEach(b=>{ if (b.dataset.view===view || (b.dataset.view==='home' && ['focus','workout','plan','finish'].includes(view))) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
      ({home:showHome,focus:showFocus,plan:showPlan,workout:showWorkout,finish:showFinish,history:showHistory,settings:showSettings}[view])();
      previewNavigation();
    }
    function tick() {
      if(view==='home' && muscleSnapshot && muscleSnapshot!==JSON.stringify(muscleActivity())) render();
      const s=active();
      const elapsed=document.getElementById('workout-elapsed');
      if (elapsed && s) { const minutes=Math.floor((Date.now()-s.startTime)/60000); const sec=Math.max(0,Math.floor((Date.now()-s.startTime)/1000)); elapsed.textContent=minutes>=60 ? Math.floor(minutes/60)+':'+String(minutes%60).padStart(2,'0')+':'+String(sec%60).padStart(2,'0') : minutes+':'+String(sec%60).padStart(2,'0'); }
      if (!s?.restEnd) return;
      const left=Math.max(0,Math.ceil((s.restEnd-Date.now())/1000));
      const timer=document.getElementById('rest-timer');
      const label=document.getElementById('rest-label');
      if (label) label.textContent=left ? (restLabel(s)) : 'Pause vorbei';
      restMax=Math.max(restMax,left);
      { const off=Math.round((1-left/(restMax||1))*1000)/1000, ring=document.getElementById('rest-progress'); ring?.setAttribute('stroke-dashoffset',String(off)); ring?.setAttribute('stroke-linecap',off>0.002?'round':'butt'); }
      if (timer) timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
      if (!left) { restAnnounced=true; endRest(s,true); }
    }
    document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
    document.addEventListener('visibilitychange',()=>{ if (!document.hidden) tick(); });
    window.addEventListener('focus',tick);
    if (active()) view='workout';
    if (active()?.restEnd && active().restEnd<=Date.now()) restAnnounced=true;
    render(); tick(); setInterval(tick,1000);
  </script>
</body>
</html>
