<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Gym Log</title>
  <style>
    :root { color-scheme:light dark; --bg:#f6f5f0; --surface:#fffefa; --ink:#242f2a; --muted:#626c65; --line:#d7dcd3; --accent:#365f49; --on-accent:#fff; --soft:#e9eee5; }
    @media (prefers-color-scheme:dark) { :root { --bg:#171d19; --surface:#202922; --ink:#e7ece4; --muted:#abb7aa; --line:#425044; --accent:#b7d4b5; --on-accent:#1d3022; --soft:#2d3a2e; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 system-ui,sans-serif; }
    .shell { max-width:680px; margin:auto; padding:28px 20px 48px; }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.7px; }
    h2 { margin:0 0 12px; font-size:25px; line-height:1.25; letter-spacing:-.5px; }
    h3 { margin:0 0 8px; font-size:19px; }
    p { margin:0 0 16px; }
    small,.muted { color:var(--muted); }
    .eyebrow { font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    nav { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:26px 0 28px; border-bottom:1px solid var(--line); padding-bottom:8px; }
    button,input,select,textarea { font:inherit; }
    button { min-height:48px; padding:11px 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); cursor:pointer; text-align:center; }
    button:hover { border-color:var(--accent); }
    button:disabled { opacity:.55; cursor:default; }
    button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    nav button { border:0; padding:10px 4px; background:transparent; font-size:15px; }
    nav button[aria-current="page"] { color:var(--accent); background:var(--soft); font-weight:650; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .card { padding:22px; border:1px solid var(--line); border-radius:16px; background:var(--surface); margin-bottom:18px; }
    .stack { display:grid; gap:12px; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .row>* { flex:1; }
    label { display:block; margin:16px 0 7px; font-size:15px; font-weight:600; }
    input:not([type=file]),select,textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); min-height:48px; }
    input[type=file] { max-width:100%; }
    textarea { resize:vertical; min-height:88px; }
    .timer { font-size:64px; font-variant-numeric:tabular-nums; letter-spacing:-3px; margin:12px 0; line-height:1.2; }
    .notice { padding:13px 16px; background:var(--soft); border-radius:10px; margin:16px 0; }
    #storage-message { border:2px solid var(--accent); }
    #feedback:empty { display:none; }
    .item { padding:16px 0; border-bottom:1px solid var(--line); }
    .item:last-child { border-bottom:0; }
    .wide { width:100%; margin-top:18px; }
    .small { font-size:14px; }
    .uncertain { border-left:4px solid #a16a23; padding-left:10px; }
    [hidden] { display:none !important; }
    .workout-bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,680px); background:var(--surface); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:3; }
    .workout-bottom p { margin:0; font-size:14px; }
    .workout-bottom progress { width:100%; height:10px; accent-color:var(--accent); }
    .workout-bottom .rest-bar { position:static; transform:none; width:100%; padding:8px 0; box-shadow:none; margin-top:6px; }
    .goal { grid-column:2 / -1; font-size:12px; color:var(--muted); }
    .next-actions { display:grid; gap:10px; margin:16px 0; }
    .workout-header { position:sticky; top:0; z-index:3; background:var(--bg); padding:12px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); margin-bottom:18px; }
    .workout-header h2 { font-size:21px; margin:0; }
    .workout-header p { margin:0; }
    .rest-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(100%,680px); z-index:4; background:var(--surface); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; align-items:center; gap:8px; box-shadow:0 -4px 20px #0001; }
    .rest-bar .rest-description { flex:1; min-width:120px; }
    .rest-bar p { margin:0; }
    .rest-bar button { padding:8px 12px; }
    .rest-bar .timer { font-size:26px; letter-spacing:0; }
    body.training .shell { padding-bottom:270px; }
    .set-grid { display:grid; grid-template-columns:22px minmax(42px,1.2fr) minmax(42px,1fr) minmax(42px,1fr) 44px; gap:5px; align-items:center; margin:8px 0; font-size:14px; }
    .set-grid input { min-width:0; padding:10px 5px; text-align:center; }
    .set-grid button { padding:8px; }
    input[aria-invalid="true"] { border:2px solid #b74730; }
    .set-adjuster { grid-column:1 / -1; padding:10px; background:var(--soft); border-radius:10px; }
    .set-adjuster p { margin:0 0 8px; font-size:14px; }
    .set-adjuster .row { flex-wrap:nowrap; gap:6px; }
    .set-adjuster button { min-width:48px; }
    .set-grid.is-done { background:var(--soft); border-radius:10px; }
    .set-grid .previous { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
    .exercise-card { padding:16px; scroll-margin-top:100px; }
    .exercise-card h3 { margin-bottom:4px; }
    details { margin-top:12px; }
    summary { cursor:pointer; min-height:44px; padding:10px 0; }
    .routine-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .exercise-jump { display:flex; gap:8px; overflow:auto; padding-bottom:12px; margin-bottom:12px; }
    .exercise-jump button { white-space:nowrap; font-size:14px; }
    footer { margin-top:30px; font-size:13px; color:var(--muted); }
    @media (max-width:360px) { .shell { padding:20px 14px; } .card { padding:18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><h1>Gym Log</h1><small>Dein Training</small></header>
    <p id="storage-message" class="notice" role="alert" hidden></p>
    <nav aria-label="Navigation">
      <button type="button" data-view="home" aria-current="page">Start</button>
      <button type="button" data-view="history">Verlauf</button>
      <button type="button" data-view="settings">Einstellungen</button>
    </nav>
    <p id="feedback" class="notice" role="status" aria-live="polite"></p>
    <main id="main"></main>
    <footer>Nur auf diesem Gerät gespeichert. Kein Konto und keine Netzwerkverbindung.</footer>
  </div>
  <script>
    'use strict';
    const KEY = 'gym-log-v1';
    let nutritionOpen=false;
    const SCHEMA = 2;
    const DEFAULTS = {
      upper:['Chest Press','Low Row','Vertical Traction','Shoulder Press','Reverse Fly','Pectoral einseitig','Back Extensions','Hammer Curls','Trizeps Pushdown'],
      lower:['Leg Press','Leg Curl','Leg Extension','Calf Raises','Adduktoren','Abduktoren','Reverse Crunches','Schrägbank-Sit-ups']
    };
    const EXTRA = ['Incline Chest Press','Lateral Raises','Hip Thrust'];
    const BODYWEIGHT = ['Reverse Crunches','Schrägbank-Sit-ups','Decline Oblique Sit-ups'];
    const main = document.getElementById('main');
    const feedback = document.getElementById('feedback');
    let view = 'home', draft = null, chosenExercise = null, selectedSession = null, historyFilter = '';
    const inputDrafts = new Map();
    let storageProblem = '', afterSet = null, lastFeedback = '', restAnnounced = false, importCandidate = null;

    function node(tag, value, className) {
      const element = document.createElement(tag);
      if (value !== undefined) element.textContent = value;
      if (className) element.className = className;
      return element;
    }
    function button(value, action, primary = false) {
      const b = node('button',value,primary ? 'primary' : ''); b.type = 'button';
      b.addEventListener('click',action); return b;
    }
    function field(parent,label,value = '',type = 'text') {
      const id = 'f'+Math.random().toString(36).slice(2);
      const caption = node('label',label); caption.htmlFor = id;
      const input = node(type === 'textarea' ? 'textarea' : 'input'); input.id = id; input.value = value;
      if (type !== 'textarea') input.type = type;
      parent.append(caption,input); return input;
    }
    function select(parent,label,options,value) {
      const caption = node('label',label), input = node('select');
      input.id = 'f'+Math.random().toString(36).slice(2); caption.htmlFor = input.id;
      options.forEach(([key,text])=>{ const o=node('option',text); o.value=key; input.append(o); });
      input.value = value; parent.append(caption,input); return input;
    }
    function say(message) { feedback.textContent = message; }
    function go(next) { if (next==='history' && view!=='home' && view!=='finish') selectedSession=null; view = next; say(''); render(); main.querySelector('h2')?.focus(); }
    function title(value) { const h=node('h2',value); h.tabIndex=-1; main.append(h); }
    function today() { const d=new Date(); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); }
    function dateLabel(key) { if (!key) return 'Datum unbekannt'; const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d,12).toLocaleDateString('de-AT',{day:'numeric',month:'long',year:'numeric'}); }
    function timeLabel(ms) { return ms === null ? 'unbekannt' : new Date(ms).toLocaleString('de-AT'); }
    function dateValid(key) { if (typeof key !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false; const [y,m,d]=key.split('-').map(Number), x=new Date(y,m-1,d,12); return x.getFullYear()===y && x.getMonth()+1===m && x.getDate()===d; }
    function kg(value) { return value === null ? '–' : String(value).replace('.',',')+' kg'; }
    function reps(value) { return value === null ? '–' : String(value); }
    function amount(value) { return value === null ? '–' : String(value).replace('.',','); }
    function parseWeight(value) { const s=value.trim().replace(',','.'); return /^\d+(?:\.\d{1,2})?$/.test(s) && Number(s)<=1000 ? Number(s) : null; }
    function parseReps(value) { const s=value.trim(); return /^\d+$/.test(s) && Number(s)>0 && Number(s)<=1000 ? Number(s) : null; }
    function parseSetText(value, bodyweight) {
      const m=value.trim().match(/^(\d+)\s*(?:x|×|mal)\s*(\d+(?:[,.]\d{1,2})?)\s*(?:kg)?$/i);
      if (!m) return null;
      const r=parseReps(m[1]), w=parseWeight(m[2]);
      return r !== null && w !== null && !bodyweight ? {reps:r,weight:w} : null;
    }
    function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
    function obj(x) { return x!==null && typeof x==='object' && !Array.isArray(x); }
    function str(x,max=300) { return typeof x==='string' && x.length<=max; }
    function stamp(x) { return x===null || (Number.isSafeInteger(x) && x>0 && x<=8640000000000000); }
    function natural(x) { return x===null || (Number.isSafeInteger(x) && x>0 && x<=1000); }
    function weight(x) { return x===null || (typeof x==='number' && Number.isFinite(x) && x>=0 && x<=1000); }
    function fresh() { return {schemaVersion:SCHEMA,settings:{restSeconds:90,betweenExerciseRestSeconds:180,exerciseRestSeconds:{},proteinTarget:140,scoopGrams:35,proteinPerScoop:26,creatineDose:5,templates:{upper:{name:'Oberkörper',exercises:[...DEFAULTS.upper]},lower:{name:'Unterkörper',exercises:[...DEFAULTS.lower]}},steps:{}},nutrition:{},sessions:[]}; }
    function migrateData(input) {
      if (!obj(input) || ![1,SCHEMA].includes(input.schemaVersion)) throw Error('Schema ungültig.');
      if (input.schemaVersion===SCHEMA) return input;
      const old=input, settings=old.settings;
      if (!obj(settings)) throw Error('Einstellungen ungültig.');
      return {...old,schemaVersion:SCHEMA,settings:{...settings,exerciseRestSeconds:{},proteinTarget:140,scoopGrams:35,proteinPerScoop:26,creatineDose:5},nutrition:{}};
    }
    function validSet(s) {
      if (!obj(s) || !['planned','completed','skipped','uncertain'].includes(s.status) || !natural(s.targetReps) || !weight(s.targetWeight) || !natural(s.actualReps) || !weight(s.actualWeight) || ![null,'leicht','mittel','schwer'].includes(s.rating) || !stamp(s.timestamp) || ![null,'live','manual_correction','imported'].includes(s.source) || !Array.isArray(s.changes) || s.changes.length>100) throw Error('Ungültiger Satz.');
      if (s.status==='planned' || s.status==='skipped') { if (s.actualReps!==null || s.actualWeight!==null || s.rating!==null || s.timestamp!==null) throw Error('Offener Satz enthält Ist-Werte.'); }
      if (s.status==='completed' && (s.actualReps===null || s.source===null)) throw Error('Abgeschlossenem Satz fehlen Werte.');
      if (s.changes.some(c=>!obj(c) || !stamp(c.at) || c.at===null || !['completed','uncertain','skipped'].includes(c.status) || !natural(c.actualReps) || !weight(c.actualWeight) || ![null,'leicht','mittel','schwer'].includes(c.rating) || !stamp(c.timestamp) || ![null,'live','manual_correction','imported'].includes(c.source))) throw Error('Ungültiges Änderungsprotokoll.');
      if (!str(s.planSlotId ?? '',80)) throw Error('Planplatz ungültig.');
      return {planSlotId:s.planSlotId ?? '',status:s.status,targetReps:s.targetReps,targetWeight:s.targetWeight,actualReps:s.actualReps,actualWeight:s.actualWeight,rating:s.rating,timestamp:s.timestamp,source:s.source,changes:s.changes.map(c=>({at:c.at,status:c.status,actualReps:c.actualReps,actualWeight:c.actualWeight,rating:c.rating,timestamp:c.timestamp,source:c.source}))};
    }
    function validateData(input) {
      input=migrateData(input);
      if (!obj(input) || input.schemaVersion!==SCHEMA || !obj(input.settings) || !Array.isArray(input.sessions) || input.sessions.length>10000) throw Error('Schema oder Sitzungen ungültig.');
      const s=input.settings, t=s.templates;
      if (!Number.isInteger(s.restSeconds) || s.restSeconds<15 || s.restSeconds>900 || !obj(t) || !obj(s.steps) || !obj(s.exerciseRestSeconds) || !Number.isFinite(s.proteinTarget) || s.proteinTarget<=0 || s.proteinTarget>300 || !Number.isFinite(s.scoopGrams) || s.scoopGrams<=0 || s.scoopGrams>300 || !Number.isFinite(s.proteinPerScoop) || s.proteinPerScoop<=0 || s.proteinPerScoop>300 || !Number.isFinite(s.creatineDose) || s.creatineDose<=0 || s.creatineDose>100) throw Error('Einstellungen ungültig.');
      const xpRules=validateXpRules(s.xpRules ?? null);
      const between=s.betweenExerciseRestSeconds ?? 180;
      if (!Number.isInteger(between) || between<15 || between>900) throw Error('Pause zwischen Übungen ungültig.');
      for (const [name,n] of Object.entries(s.exerciseRestSeconds)) if (!name || name.length>80 || !Number.isInteger(n) || n<15 || n>900) throw Error('Übungspause ungültig.');
      if (!obj(input.nutrition)) throw Error('Ernährung ungültig.');
      const nutrition={};
      for (const [day,entry] of Object.entries(input.nutrition)) {
        if (!dateValid(day) || !obj(entry) || !Array.isArray(entry.protein) || entry.protein.length>10000 || typeof entry.creatine!=='boolean' || entry.protein.some(x=>!obj(x) || typeof x.g!=='number' || !Number.isFinite(x.g) || x.g<=0 || x.g>300 || !stamp(x.time) || x.time===null)) throw Error('Ernährung ungültig.');
        nutrition[day]={protein:entry.protein.map(x=>({g:x.g,time:x.time})),creatine:entry.creatine};
      }
      const templates={};
      for (const key of ['upper','lower']) {
        const item=t[key];
        if (!obj(item) || !str(item.name,60) || !item.name.trim() || !Array.isArray(item.exercises) || item.exercises.length>100 || item.exercises.some(n=>!str(n,80) || !n.trim()) || new Set(item.exercises).size!==item.exercises.length) throw Error('Vorlage ungültig.');
        templates[key]={name:item.name,exercises:[...item.exercises]};
      }
      const steps={};
      for (const [name,n] of Object.entries(s.steps)) { if (!name || name.length>80 || typeof n!=='number' || !Number.isFinite(n) || n<=0 || n>100) throw Error('Gewichtsschritt ungültig.'); steps[name]=n; }
      const seen=new Set(), sessions=[]; let active=0;
      for (const session of input.sessions) {
        if (!obj(session) || !str(session.id,80) || !session.id || seen.has(session.id) || !dateValid(session.date) || !['upper','lower'].includes(session.type) || !['active','completed'].includes(session.status) || !stamp(session.startTime) || !stamp(session.endTime) || !stamp(session.restEnd ?? null) || !str(session.currentExerciseId ?? '',80) || !str(session.restExercise ?? '',80) || !['set','exercise'].includes(session.restKind ?? 'set') || !str(session.note,1000) || !Array.isArray(session.exercises) || session.exercises.length>100) throw Error('Sitzung ungültig.');
        seen.add(session.id);
        if (session.status==='active') { active++; if (session.startTime===null || session.endTime!==null) throw Error('Aktive Sitzung ungültig.'); }
        if (session.status==='completed' && session.restEnd) throw Error('Pause in abgeschlossener Sitzung.');
        if (session.startTime!==null && session.endTime!==null && session.endTime<session.startTime) throw Error('Zeitfolge ungültig.');
        const exerciseIds=new Set();
        const exercises=session.exercises.map(e=>{
          if (!obj(e) || (e.deferred!==undefined && typeof e.deferred!=='boolean') || !str(e.id,80) || !e.id || exerciseIds.has(e.id) || !str(e.name,80) || !e.name.trim() || !str(e.note,500) || !Array.isArray(e.sets) || e.sets.length>50) throw Error('Übung ungültig.');
          exerciseIds.add(e.id);
          return {id:e.id,name:e.name,note:e.note,deferred:e.deferred ?? false,sets:e.sets.map(validSet)};
        });
        let planSlots=null;
        if (session.planSlots!=null) {
          if (!Array.isArray(session.planSlots) || session.planSlots.length>5000) throw Error('Trainingsplan ungültig.');
          const slotIds=new Set();
          planSlots=session.planSlots.map(slot=>{
            if (!obj(slot) || !str(slot.id,80) || !slot.id || slotIds.has(slot.id) || !str(slot.exerciseName,80) || !Number.isInteger(slot.setIndex) || slot.setIndex<0 || slot.setIndex>=50 || !natural(slot.targetReps) || !weight(slot.targetWeight)) throw Error('Planplatz ungültig.');
            slotIds.add(slot.id); return {id:slot.id,exerciseName:slot.exerciseName,setIndex:slot.setIndex,targetReps:slot.targetReps,targetWeight:slot.targetWeight};
          });
          const bound=new Set();
          exercises.forEach(e=>e.sets.forEach(set=>{ if(set.planSlotId) { if(!slotIds.has(set.planSlotId) || bound.has(set.planSlotId)) throw Error('Doppelter oder unbekannter Planplatz.'); bound.add(set.planSlotId); } }));
        }
        const sessionRules=validateXpRules(session.xpRules ?? null);
        sessions.push({planSlots,xpRules:sessionRules,id:session.id,date:session.date,type:session.type,status:session.status,startTime:session.startTime,endTime:session.endTime,restEnd:session.restEnd ?? null,restExercise:session.restExercise ?? '',restKind:session.restKind ?? 'set',currentExerciseId:session.currentExerciseId ?? '',note:session.note,exercises});
      }
      if (active>1) throw Error('Mehrere aktive Sitzungen.');
      return {schemaVersion:SCHEMA,settings:{xpRules,restSeconds:s.restSeconds,betweenExerciseRestSeconds:between,exerciseRestSeconds:{...s.exerciseRestSeconds},proteinTarget:s.proteinTarget,scoopGrams:s.scoopGrams,proteinPerScoop:s.proteinPerScoop,creatineDose:s.creatineDose,templates,steps},nutrition,sessions};
    }
    function warning(message) { storageProblem=message; const e=document.getElementById('storage-message'); e.textContent=message; e.hidden=false; }
    function read() {
      let raw;
      try { raw=localStorage.getItem(KEY); } catch { warning('Speicher nicht verfügbar. Änderungen bleiben nur bis zum Schließen dieser Seite erhalten. Bitte Daten exportieren.'); return fresh(); }
      if (raw!==null) try { return validateData(JSON.parse(raw)); } catch { warning('Gespeicherte Daten sind ungültig und wurden nicht überschrieben. Diese Seite nutzt vorläufige Daten. Bitte gültige Daten importieren.'); }
      return fresh();
    }
    let data=read();
    try { const saved=localStorage.getItem(KEY); if (saved && JSON.parse(saved).schemaVersion!==SCHEMA) save(); } catch {}
    function save() {
      if (storageProblem.startsWith('Gespeicherte Daten')) return false;
      try { localStorage.setItem(KEY,JSON.stringify(data)); return true; }
      catch { warning('Speicher nicht verfügbar. Änderungen bleiben nur bis zum Schließen dieser Seite erhalten. Bitte Daten exportieren.'); return false; }
    }
    function active() { return data.sessions.find(s=>s.status==='active'); }
    function completed() { return data.sessions.filter(s=>s.status==='completed').sort((a,b)=>(b.startTime || Date.parse(b.date))-(a.startTime || Date.parse(a.date))); }
    function previous(name,excludeId=null) { return completed().filter(s=>s.id!==excludeId).flatMap(s=>s.exercises.filter(e=>e.name===name).map(e=>({session:s,exercise:e})))[0] || null; }
    function step(name) { return data.settings.steps[name] || 2.5; }
    function restFor(name) { return data.settings.exerciseRestSeconds[name] || data.settings.restSeconds; }
    function bodyweight(name) { return BODYWEIGHT.includes(name); }
    function emptySet(r,w) { return {status:'planned',targetReps:r,targetWeight:w,actualReps:null,actualWeight:null,rating:null,timestamp:null,source:null,changes:[]}; }
    function targets(name) {
      const old=previous(name), defaultReps=[12,10,8], count=Math.max(3,old?.exercise.sets.length || 0);
      return Array.from({length:count},(_,i)=>{
        const last=old?.exercise.sets[i], plan=last?.targetReps ?? defaultReps[i] ?? 8, r=last?.status==='completed' ? Math.max(last.actualReps,plan) : plan;
        if (bodyweight(name)) return emptySet(r,null);
        if (!last) return emptySet(r,null);
        const w=last.actualWeight;
        if (w===null) return emptySet(r,null);
        return emptySet(r,w);
      });
    }
    function exercise(name) { return {id:uid(),name,note:previous(name)?.exercise.note || '',sets:targets(name)}; }
    function suggestedType() { const last=completed()[0]; return last?.type==='upper' ? 'lower' : 'upper'; }
    function newDraft(type) { return {type,exercises:data.settings.templates[type].exercises.map(exercise)}; }

        try {
          if (f.size>5*1024*1024) throw Error('Datei ist größer als 5 MB.');
          const candidate=validateData(JSON.parse(await f.text())); importCandidate=candidate;
          preview.append(node('p','Gültige Datei: '+candidate.sessions.length+' Sitzungen. Der Import ersetzt alle vorhandenen Daten.','notice'));
          preview.append(button('Daten ersetzen',()=>{
            if (!importCandidate || !window.confirm('Alle Gym-Log-Daten durch diese Datei ersetzen?')) return;
            const next=validateData(importCandidate), old=data, prior=storageProblem;
            data=next; storageProblem='';
            if (!save()) { data=old; storageProblem=prior; say('Import nicht gespeichert. Vorhandene Daten bleiben erhalten.'); return; }
            document.getElementById('storage-message').hidden=true; draft=null; chosenExercise=null; selectedSession=null; historyFilter=''; inputDrafts.clear(); importCandidate=null; go('home'); say('Daten importiert.');
          },true));
        } catch(error) { preview.append(node('p','Import fehlgeschlagen: '+error.message,'notice')); }
      }); main.append(backup);
    }
    function render() {
      document.getElementById('rest-bar')?.remove();
      document.getElementById('workout-bottom')?.remove();
      document.body.classList.toggle('training',view==='workout');
      main.replaceChildren();
      document.querySelectorAll('nav button').forEach(b=>{ if (b.dataset.view===view || (b.dataset.view==='home' && ['workout','plan','finish'].includes(view))) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
      ({home:showHome,plan:showPlan,workout:showWorkout,finish:showFinish,history:showHistory,settings:showSettings}[view])();
    }
    function tick() {
      const s=active();
      const elapsed=document.getElementById('workout-elapsed');
      if (elapsed && s) { const minutes=Math.floor((Date.now()-s.startTime)/60000); elapsed.textContent=minutes+' Min. Training'; }
      if (!s?.restEnd) return;
      const left=Math.max(0,Math.ceil((s.restEnd-Date.now())/1000));
      const timer=document.getElementById('rest-timer');
      const label=document.getElementById('rest-label');
      if (label) label.textContent=left ? (restLabel(s)) : 'Pause vorbei';
      if (timer) timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
      if (!left && !restAnnounced) { restAnnounced=true; if (navigator.vibrate) navigator.vibrate(250); say('Pause vorbei. Bereit für den nächsten Satz.'); }
    }
    document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
    document.addEventListener('visibilitychange',()=>{ if (!document.hidden) tick(); });
    window.addEventListener('focus',tick);
    if (active()) view='workout';
    if (active()?.restEnd && active().restEnd<=Date.now()) restAnnounced=true;
    render(); tick(); setInterval(tick,1000);
  </script>
</body>
</html>
